<html>
<head>
  <meta charset="utf-8">
  <title>환영합니다!</title>
</head>
<body style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px;">
  <div style="text-align: center; margin-bottom: 30px;">
    <h1 style="color: #333; margin-bottom: 10px;">안녕하세요 {{name}}님! 👋</h1>
    <h2 style="color: #666; font-weight: normal;">${project_name}에 가입해 주셔서 감사합니다!</h2>
  </div>

  <div style="background-color: #f8f9fa; padding: 25px; border-radius: 8px; margin: 25px 0;">
    <h3 style="color: #495057; margin-top: 0;">🎯 이제 이용 가능한 기능들:</h3>
    <ul style="color: #6c757d; line-height: 1.6;">
      <li>🎯 개인화된 AI 추천 서비스</li>
      <li>👥 활발한 커뮤니티 참여</li>
      <li>🔔 실시간 알림 서비스</li>
      <li>📊 개인 통계 및 분석</li>
    </ul>
  </div>

  <div style="text-align: center; margin: 30px 0;">
    <a href="{{app_url}}" 
       style="background-color: #007bff; color: white; padding: 15px 30px; 
              text-decoration: none; border-radius: 5px; font-weight: bold; 
              display: inline-block;">
      ${project_name} 시작하기
    </a>
  </div>

  <div style="background-color: #e9ecef; padding: 20px; border-radius: 8px; margin: 25px 0;">
    <p style="margin: 0; color: #495057;">
      <strong>💡 팁:</strong> 프로필을 완성하면 더 정확한 추천을 받을 수 있어요!
    </p>
  </div>

  <p style="color: #6c757d;">
    궁금한 점이 있으시면 언제든 
    <a href="mailto:{{support_email}}" style="color: #007bff;">문의</a>해 주세요.
  </p>

  <hr style="margin: 40px 0; border: none; border-top: 1px solid #dee2e6;">
  
  <div style="text-align: center;">
    <p style="color: #6c757d; font-size: 14px; margin: 0;">
      <strong>${project_name} 팀</strong><br>
      이 메일은 발신 전용입니다.
    </p>
  </div>
</body>
</html>
