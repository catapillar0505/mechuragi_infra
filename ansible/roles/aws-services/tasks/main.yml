---
# Python pip 설치
- name: 1. Python pip 설치
  package:
    name: python3-pip
    state: present
  become: yes

# Python 라이브러리 설치
- name: 2. Python AWS SDK 설치
  pip:
    name:
      - boto3
      - botocore
    state: present
    executable: pip3

# 설정 디렉토리 생성
- name: 3. 설정 디렉토리 생성
  file:
    path: "{{ config_directory }}"
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '0755'
  become: yes

# Bedrock 설정 파일 및 스크립트
- name: 4. Bedrock 설정 파일 생성
  copy:
    content: |
      # AWS Bedrock Configuration for {{ project_name }}
      # Terraform에서 생성된 리소스 정보

      AWS_REGION={{ aws_region }}

      # Bedrock Model IDs (Parameter Store에서 가져오기)
      BEDROCK_CHAT_MODEL={{ bedrock_chat_model }}
      BEDROCK_SMART_MODEL={{ bedrock_smart_model }}
      BEDROCK_EMBEDDING_MODEL={{ bedrock_embedding_model }}

      # Bedrock Endpoints
      BEDROCK_ENDPOINT=https://bedrock.{{ aws_region }}.amazonaws.com
      BEDROCK_RUNTIME_ENDPOINT=https://bedrock-runtime.{{ aws_region }}.amazonaws.com

      # Model Parameters
      MAX_TOKENS=1000
      TEMPERATURE=0.7
      TOP_P=0.9

      # Rate Limiting
      REQUESTS_PER_MINUTE=60
      CONCURRENT_REQUESTS=5
    dest: "{{ config_directory }}/bedrock_config.env"
    owner: ubuntu
    group: ubuntu
    mode: '0644'

# SES 설정 파일
- name: 5. SES 설정 파일 생성
  copy:
    content: |
      # AWS SES Configuration for {{ project_name }}
      # Terraform에서 생성된 리소스 정보

      AWS_REGION={{ aws_region }}

      # SES 설정 (Terraform 출력값 참조)
      SES_FROM_EMAIL={{ ses_email }}
      SES_CONFIGURATION_SET={{ project_name }}-{{ env }}

      # 이메일 템플릿 이름
      WELCOME_EMAIL_TEMPLATE={{ project_name }}-welcome-email
      PASSWORD_RESET_TEMPLATE={{ project_name }}-password-reset

      # 이메일 발송 제한
      MAX_SEND_RATE=14  # 초당 최대 발송 수 (SES 기본값)
      MAX_24H_SEND=200  # 24시간 최대 발송 수 (SES 기본값)
    dest: "{{ config_directory }}/ses_config.env"
    owner: ubuntu
    group: ubuntu
    mode: '0644'

# CloudFront 설정 파일
- name: 6. CloudFront 설정 파일 생성
  copy:
    content: |
      # CloudFront Configuration for {{ project_name }}
      # Terraform에서 생성된 리소스 정보

      # CloudFront 배포 정보 (terraform output에서 가져오기)
      # CLOUDFRONT_DISTRIBUTION_ID=<terraform output>
      # CLOUDFRONT_DOMAIN_NAME=<terraform output>
      # CLOUDFRONT_URL=<terraform output>

      # S3 버킷 정보
      S3_BUCKET_NAME={{ s3_bucket_name }}

      # CDN 설정
      CACHE_BEHAVIORS=/images/*:604800,/api/*:0,/*:86400
      CLOUDFRONT_REGIONS=US,CA,EU

      # 파일 업로드 설정
      MAX_FILE_SIZE=10MB
      ALLOWED_FILE_TYPES=jpg,jpeg,png,gif,webp,svg

      # CloudFront 무효화 설정
      MAX_INVALIDATION_PATHS=1000
      INVALIDATION_COST_THRESHOLD=1000
    dest: "{{ config_directory }}/cloudfront_config.env"
    owner: ubuntu
    group: ubuntu
    mode: '0644'