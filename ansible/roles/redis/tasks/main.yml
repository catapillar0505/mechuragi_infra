---
- name: 1. Redis 설치
  ansible.builtin.apt:
    name: redis-server
    state: present
    update_cache: yes

- name: 2. Redis 설정 - bind 주소 변경
  lineinfile:
    path: /etc/redis/redis.conf
    regexp: '^bind 127.0.0.1'
    line: 'bind 0.0.0.0'
    backup: yes

- name: 3. Redis 포트 설정
  lineinfile:
    path: /etc/redis/redis.conf
    regexp: '^port'
    line: "port {{ redis_port }}"

- name: 4. Redis 서비스 시작 및 활성화
  systemd:
    name: redis-server
    state: started
    enabled: yes

- name: 5. Redis 연결 테스트 (ping)
  command: redis-cli ping
  register: redis_ping
  ignore_errors: yes

- name: 6. Redis 연결 테스트 결과 출력
  debug:
    msg: "Redis 연결 상태: {{ redis_ping.stdout if redis_ping.rc == 0 else 'Redis 연결 실패' }}"

- name: 7. Redis 메모리 사용량 확인
  command: redis-cli info memory
  register: redis_memory
  ignore_errors: yes

- name: 8. Redis 메모리 정보 출력
  debug:
    msg: "Redis 메모리 정보: {{ redis_memory.stdout_lines[:5] if redis_memory.rc == 0 else 'Redis 메모리 정보 확인 실패' }}"