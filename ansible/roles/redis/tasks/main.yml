---
- name: Redis 패키지 설치
  apt:
    name:
      - redis-server
    state: present

- name: Redis 설정 파일 생성
  template:
    src: redis.conf.j2
    dest: /etc/redis/redis.conf
    backup: yes
    owner: redis
    group: redis
    mode: '0640'
  notify: Redis 재시작

- name: Redis 데이터 디렉토리 생성
  file:
    path: /var/lib/redis
    state: directory
    owner: redis
    group: redis
    mode: '0755'

- name: Redis 로그 디렉토리 생성
  file:
    path: /var/log/redis
    state: directory
    owner: redis
    group: redis
    mode: '0755'

- name: Redis systemd 오버라이드 설정
  template:
    src: redis-override.conf.j2
    dest: /etc/systemd/system/redis-server.service.d/override.conf
    mode: '0644'
  notify:
    - systemd 다시로드
    - Redis 재시작

- name: systemd 서비스 디렉토리 생성
  file:
    path: /etc/systemd/system/redis-server.service.d
    state: directory
    mode: '0755'

- name: Redis 서비스 시작 및 활성화
  systemd:
    name: redis-server
    state: started
    enabled: yes

- name: Redis 백업 디렉토리 생성
  file:
    path: "{{ redis_backup_dir }}"
    state: directory
    owner: redis
    group: redis
    mode: '0700'

- name: Redis 백업 스크립트 설치
  template:
    src: redis-backup.sh.j2
    dest: /usr/local/bin/redis-backup.sh
    mode: '0700'
    owner: root
    group: root

- name: Redis 백업 크론 작업 설정
  cron:
    name: "Redis 자동 백업"
    minute: "30"
    hour: "2"
    job: "/usr/local/bin/redis-backup.sh"
    user: root

- name: Redis 로그 로테이션 설정
  template:
    src: redis-logrotate.j2
    dest: /etc/logrotate.d/redis-server
    mode: '0644'

- name: 커널 메모리 오버커밋 설정
  sysctl:
    name: vm.overcommit_memory
    value: '1'
    state: present
    sysctl_file: /etc/sysctl.d/redis.conf

- name: 투명 대용량 페이지 비활성화
  lineinfile:
    path: /etc/rc.local
    line: 'echo never > /sys/kernel/mm/transparent_hugepage/enabled'
    create: yes
    mode: '0755'

- name: Redis 설치 완료 메시지
  debug:
    msg: |
      ⚡ Redis 캐시 서버 구축 완료!
      - 포트: {{ redis_port }}
      - 최대 메모리: {{ redis_maxmemory }}
      - 백업 디렉토리: {{ redis_backup_dir }}