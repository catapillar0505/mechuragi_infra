---
- name: Nginx 패키지 설치
  apt:
    name: nginx
    state: present

- name: Nginx 서비스 시작 및 활성화
  systemd:
    name: nginx
    state: started
    enabled: yes

- name: Nginx 로그 디렉토리 생성
  file:
    path: "{{ log_directory }}"
    state: directory
    owner: www-data
    group: www-data
    mode: '0755'

- name: Nginx 설정 파일 생성
  template:
    src: "{{ nginx_site_template }}"
    dest: "/etc/nginx/sites-available/{{ nginx_site_name }}"
    backup: yes
  notify: Nginx 재시작
  when: nginx_site_template is defined

- name: Nginx 사이트 활성화
  file:
    src: "/etc/nginx/sites-available/{{ nginx_site_name }}"
    dest: "/etc/nginx/sites-enabled/{{ nginx_site_name }}"
    state: link
  notify: Nginx 재시작
  when: nginx_site_template is defined

- name: 기본 Nginx 사이트 비활성화
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Nginx 재시작
  when: nginx_remove_default_site

- name: Nginx 설정 테스트
  command: nginx -t
  register: nginx_test_result
  changed_when: false

- name: Nginx 설정 테스트 결과 출력
  debug:
    msg: "Nginx 설정 테스트: {{ 'PASS' if nginx_test_result.rc == 0 else 'FAIL' }}"

- name: Nginx 설치 완료 메시지
  debug:
    msg: |
      🌐 Nginx 리버스 프록시 구축 완료!
      - 사이트: {{ nginx_site_name | default('default') }}
      - 상태: {{ ansible_facts['services']['nginx']['state'] | default('unknown') }}