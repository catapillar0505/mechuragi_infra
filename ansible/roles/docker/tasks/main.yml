---
- name: 1. Docker 필요 패키지 설치
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: yes

- name: 2. Docker GPG 키 추가
  ansible.builtin.apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: 3. Docker 저장소 추가
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present

- name: 4. Docker CE 설치
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
    state: present
    update_cache: yes

- name: 5. Docker 서비스 시작 및 활성화
  systemd:
    name: docker
    state: started
    enabled: yes

- name: 6. ubuntu를 docker 그룹에 추가
  user:
    name: ubuntu
    groups: docker
    append: yes

- name: 7. Docker Compose 설치
  get_url:
    url: "https://github.com/docker/compose/releases/download/{{ docker_compose_version }}/docker-compose-linux-x86_64"
    dest: /usr/local/bin/docker-compose
    mode: '0755'

- name: 8. Docker Compose 심볼릭 링크 생성
  file:
    src: /usr/local/bin/docker-compose
    dest: /usr/bin/docker-compose
    state: link

- name: 9. Docker 설치 확인
  command: docker --version
  register: docker_version
  ignore_errors: yes

- name: 10. Docker Compose 설치 확인
  command: docker-compose --version
  register: docker_compose_version_check
  ignore_errors: yes

- name: 11. Docker 환경 구성 완료 메시지
  debug:
    msg:
      - "🐋 Docker 환경 구성 완료!"
      - "Docker 버전: {{ docker_version.stdout if docker_version.rc == 0 else '확인 실패' }}"
      - "Docker Compose 버전: {{ docker_compose_version_check.stdout if docker_compose_version_check.rc == 0 else '확인 실패' }}"
      - "ubuntu 사용자가 docker 그룹에 추가되었습니다."