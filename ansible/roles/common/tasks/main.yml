---
- name: 시스템 패키지 업데이트
  apt:
    update_cache: yes
    upgrade: dist

- name: 기본 패키지 설치
  apt:
    name:
      - curl
      - wget
      - unzip
      - git
      - htop
      - vim
      - tree
    state: present

- name: 애플리케이션 디렉토리 생성
  file:
    path: "{{ app_directory }}"
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '0755'

- name: 설정 디렉토리 생성
  file:
    path: "{{ config_directory }}"
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '0755'

- name: 시간대 설정
  timezone:
    name: Asia/Seoul

- name: 로케일 설정
  locale_gen:
    name: ko_KR.UTF-8
    state: present

- name: 스왑 파일 비활성화 (Redis 최적화)
  shell: swapoff -a
  ignore_errors: yes

- name: 커널 매개변수 최적화
  sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    sysctl_file: /etc/sysctl.d/99-mechuragi.conf
  loop:
    - { name: "vm.overcommit_memory", value: "1" }
    - { name: "net.core.somaxconn", value: "65535" }
    - { name: "fs.file-max", value: "100000" }