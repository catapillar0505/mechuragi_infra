---
# MySQL 기본 설정
mysql_root_password: "mechuragi123!"
mysql_app_user: "mechuragi_user"
mysql_app_password: "mechuragi_pass"
mysql_database: "mechuragi_db"

# MySQL 성능 설정 (t3.small 최적화)
mysql_innodb_buffer_pool_size: "1G"
mysql_innodb_log_file_size: "128M"
mysql_innodb_log_buffer_size: "16M"
mysql_max_connections: 100
mysql_query_cache_size: "64M"
mysql_query_cache_limit: "2M"

# 백업 설정
mysql_backup_dir: "/var/backups/mysql"
mysql_backup_retention_days: 7

# 로그 설정
mysql_slow_query_log: yes
mysql_slow_query_time: 2
mysql_log_error: "/var/log/mysql/error.log"