---
- name: MySQL 패키지 설치
  apt:
    name:
      - mysql-server
      - mysql-client
      - python3-pymysql
    state: present

- name: MySQL 설정 파일 생성
  template:
    src: mysql.cnf.j2
    dest: /etc/mysql/mysql.conf.d/mechuragi.cnf
    backup: yes
  notify: MySQL 재시작

- name: /root/.my.cnf 파일 생성
  template:
    src: root-my.cnf.j2
    dest: /root/.my.cnf
    owner: root
    group: root
    mode: '0600'

- name: MySQL 서비스 시작 및 활성화
  systemd:
    name: mysql
    state: started
    enabled: yes

- name: 애플리케이션 데이터베이스 생성
  mysql_db:
    name: "{{ mysql_database }}"
    state: present
  ignore_errors: yes

- name: 애플리케이션 사용자 생성
  mysql_user:
    name: "{{ mysql_app_user }}"
    password: "{{ mysql_app_password }}"
    priv: "{{ mysql_database }}.*:ALL"
    host: "%"
    state: present
  ignore_errors: yes

- name: MySQL 설치 완료 메시지
  debug:
    msg: |
      🗄️ MySQL 데이터베이스 구축 완료!
      - 데이터베이스: {{ mysql_database }}
      - 사용자: {{ mysql_app_user }}