---
- name: MySQL 패키지 설치
  apt:
    name:
      - mysql-server
      - mysql-client
      - python3-pymysql
    state: present

- name: MySQL 설정 파일 생성
  template:
    src: mysql.cnf.j2
    dest: /etc/mysql/mysql.conf.d/mechuragi.cnf
    backup: yes
  notify: MySQL 재시작

- name: 기본 mysqld.cnf의 bind-address 주석 처리 (중복 설정 방지)
  lineinfile:
    path: /etc/mysql/mysql.conf.d/mysqld.cnf
    regexp: '^bind-address\s*='
    line: '# bind-address = 127.0.0.1  # Commented out by Ansible - using mechuragi.cnf instead'
    backup: yes
  notify: MySQL 재시작

- name: /root/.my.cnf 파일 생성
  template:
    src: root-my.cnf.j2
    dest: /root/.my.cnf
    owner: root
    group: root
    mode: '0600'

- name: MySQL 서비스 시작 및 활성화
  systemd:
    name: mysql
    state: started
    enabled: yes

- name: 애플리케이션 데이터베이스 생성
  shell: |
    sudo mysql -e "CREATE DATABASE IF NOT EXISTS {{ mysql_database }};"
  register: db_creation
  changed_when: false
  ignore_errors: yes

- name: 애플리케이션 사용자 생성 및 권한 부여 (VPC 내부)
  shell: |
    sudo mysql -e "CREATE USER IF NOT EXISTS '{{ mysql_app_user }}'@'10.0.%' IDENTIFIED BY '{{ mysql_app_password }}';"
    sudo mysql -e "GRANT ALL PRIVILEGES ON {{ mysql_database }}.* TO '{{ mysql_app_user }}'@'10.0.%';"
  register: user_creation_vpc
  changed_when: false
  ignore_errors: yes

- name: 애플리케이션 사용자 생성 및 권한 부여 (localhost)
  shell: |
    sudo mysql -e "CREATE USER IF NOT EXISTS '{{ mysql_app_user }}'@'localhost' IDENTIFIED BY '{{ mysql_app_password }}';"
    sudo mysql -e "GRANT ALL PRIVILEGES ON {{ mysql_database }}.* TO '{{ mysql_app_user }}'@'localhost';"
  register: user_creation_local
  changed_when: false
  ignore_errors: yes

- name: 권한 플러시
  shell: sudo mysql -e "FLUSH PRIVILEGES;"
  changed_when: false
  ignore_errors: yes

- name: MySQL 설치 완료 메시지
  debug:
    msg: |
      🗄️ MySQL 데이터베이스 구축 완료!
      - 데이터베이스: {{ mysql_database }}
      - 사용자: {{ mysql_app_user }}