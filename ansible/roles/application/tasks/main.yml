---
- name: Docker Compose 파일 생성
  template:
    src: "{{ app_docker_compose_template }}"
    dest: "{{ app_directory }}/docker-compose.yml"
    owner: ubuntu
    group: ubuntu
    mode: '0644'
  when: app_docker_compose_template is defined

- name: 환경 변수 파일 생성
  template:
    src: "{{ app_env_template }}"
    dest: "{{ app_directory }}/.env"
    owner: ubuntu
    group: ubuntu
    mode: '0600'
  when: app_env_template is defined

- name: 애플리케이션 로그 디렉토리 생성
  file:
    path: "{{ app_log_directory }}"
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '0755'
  when: app_log_directory is defined

- name: 로그 로테이션 설정
  template:
    src: "{{ app_logrotate_template }}"
    dest: "/etc/logrotate.d/{{ app_name }}"
    mode: '0644'
  when: app_logrotate_template is defined

- name: Docker 네트워크 생성
  docker_network:
    name: "{{ app_docker_network }}"
    driver: bridge
  when: app_docker_network is defined

- name: 기존 컨테이너 중지 및 제거
  community.docker.docker_compose_v2:
    project_src: "{{ app_directory }}"
    state: absent
  ignore_errors: yes
  when: app_force_recreate | default(false)

- name: Docker Compose로 애플리케이션 시작
  community.docker.docker_compose_v2:
    project_src: "{{ app_directory }}"
    state: present
    pull: yes
  when: app_docker_compose_template is defined

- name: 애플리케이션 상태 확인
  uri:
    url: "{{ app_health_check_url }}"
    method: GET
    timeout: 30
  register: health_check_result
  retries: 10
  delay: 10
  ignore_errors: yes
  when: app_health_check_url is defined

- name: 애플리케이션 배포 완료 메시지
  debug:
    msg: |
      🚀 {{ app_name }} 애플리케이션 배포 완료!
      - 서비스 타입: {{ app_type | default('unknown') }}
      - 포트: {{ app_port | default('unknown') }}
      - 상태: {{ 'HEALTHY' if (health_check_result.status is defined and health_check_result.status == 200) else 'UNKNOWN' }}