---
- name: 애플리케이션 재시작
  community.docker.docker_compose_v2:
    project_src: "{{ app_directory }}"
    state: present
    restarted: yes

- name: 애플리케이션 중지
  community.docker.docker_compose_v2:
    project_src: "{{ app_directory }}"
    state: absent

- name: 애플리케이션 시작
  community.docker.docker_compose_v2:
    project_src: "{{ app_directory }}"
    state: present