---
- name: 데이터베이스 서버 구축
  hosts: database
  become: yes
  vars_files:
    - ../group_vars/all/main.yml
  roles:
    - mysql

  post_tasks:
    - name: MySQL 설치 완료 메시지
      debug:
        msg: |
          ✅ MySQL 데이터베이스 서버 설치 완료!

          검증 테스트 실행:
          ansible-playbook -i inventory/hosts.yml playbooks/test/test-db.yml