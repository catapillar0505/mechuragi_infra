---
- name: 캐시 서버 구축
  hosts: cache
  become: yes
  vars_files:
    - ../group_vars/all/main.yml
  roles:
    - common
    - redis

  post_tasks:
    - name: Redis 설치 완료 메시지
      debug:
        msg: |
          ✅ Redis 캐시 서버 설치 완료!

          검증 테스트 실행:
          ansible-playbook -i inventory/hosts.yml playbooks/test/test-redis.yml