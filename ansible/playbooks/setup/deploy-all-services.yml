---
- name: 메추라기 인프라 전체 배포
  hosts: localhost
  gather_facts: no
  tasks:
    - name: 배포 시작 메시지
      debug:
        msg: |
          🚀 메추라기 인프라 전체 배포 시작
          =====================================
          배포 순서:
          1. 데이터베이스 서버 (MySQL)
          2. 캐시 서버 (Redis)
          3. Nginx 리버스 프록시 (Main/AI Service)
          =====================================

# 1단계: 데이터베이스 구축
- import_playbook: setup-database.yml

# 2단계: 캐시 구축
- import_playbook: setup-cache.yml

# 3단계: Nginx 구축
- import_playbook: setup-nginx.yml

# 최종 완료 메시지
- name: 배포 완료
  hosts: localhost
  gather_facts: no
  tasks:
    - name: 배포 완료 메시지
      debug:
        msg: |
          =====================================
          ✅ 메추라기 인프라 전체 배포 완료!
          =====================================

          검증 테스트 실행:
          ansible-playbook -i inventory/hosts.yml playbooks/test/test-db.yml
          ansible-playbook -i inventory/hosts.yml playbooks/test/test-redis.yml
          ansible-playbook -i inventory/hosts.yml playbooks/test/test-connectivity.yml