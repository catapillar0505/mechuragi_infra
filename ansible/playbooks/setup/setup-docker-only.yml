---
- name: Docker 설치 (메인/AI 서비스)
  hosts: main_service,ai_service
  become: yes
  vars_files:
    - ../group_vars/all/main.yml
  roles:
    - docker

  post_tasks:
    - name: Docker 설치 완료 메시지
      debug:
        msg: |
          ✅ Docker 설치 완료!

          검증 테스트 실행:
          ansible-playbook -i inventory/hosts.yml playbooks/test/test-docker.yml