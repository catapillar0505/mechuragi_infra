---
# Main Service - Nginx 설치 및 설정
- name: Main Service - Nginx 설치 및 설정
  hosts: main_service
  become: yes
  gather_facts: no
  vars_files:
    - ../../group_vars/all/main.yml
  tasks:
    - name: Nginx 패키지 설치
      apt:
        name: nginx
        state: present
        update_cache: yes

    - name: Nginx 서비스 시작 및 활성화
      systemd:
        name: nginx
        state: started
        enabled: yes

    - name: Nginx 설정 파일 배포 (API만 처리)
      template:
        src: ../../roles/nginx/templates/nginx-main-service.conf.j2
        dest: /etc/nginx/sites-available/main-service
        backup: yes
      register: nginx_config

    - name: 기본 Nginx 사이트 비활성화
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Nginx 사이트 활성화
      file:
        src: /etc/nginx/sites-available/main-service
        dest: /etc/nginx/sites-enabled/main-service
        state: link

    - name: Nginx 설정 테스트
      command: nginx -t
      register: nginx_test
      ignore_errors: yes

    - name: Nginx 재시작 (설정 변경 시)
      systemd:
        name: nginx
        state: restarted
      when: nginx_config.changed and nginx_test.rc == 0

# AI Service - Nginx 설치 및 설정
- name: AI Service - Nginx 설치 및 설정
  hosts: ai_service
  become: yes
  gather_facts: no
  vars_files:
    - ../../group_vars/all/main.yml
  tasks:
    - name: Nginx 패키지 설치
      apt:
        name: nginx
        state: present
        update_cache: yes

    - name: Nginx 서비스 시작 및 활성화
      systemd:
        name: nginx
        state: started
        enabled: yes

    - name: Nginx 설정 파일 배포 (API만 처리)
      template:
        src: ../../roles/nginx/templates/nginx-ai-service.conf.j2
        dest: /etc/nginx/sites-available/ai-service
        backup: yes
      register: nginx_config

    - name: 기본 Nginx 사이트 비활성화
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Nginx 사이트 활성화
      file:
        src: /etc/nginx/sites-available/ai-service
        dest: /etc/nginx/sites-enabled/ai-service
        state: link

    - name: Nginx 설정 테스트
      command: nginx -t
      register: nginx_test
      ignore_errors: yes

    - name: Nginx 재시작 (설정 변경 시)
      systemd:
        name: nginx
        state: restarted
      when: nginx_config.changed and nginx_test.rc == 0

  post_tasks:
    - name: Nginx 설치 완료 메시지
      debug:
        msg: |
          ✅ Nginx 설치 및 설정 완료!
