---
- name: Setup MySQL Database (Native Installation)
  hosts: database
  become: yes
  vars:
    service_name: "mysql"

  tasks:
    - name: Update system packages
      apt:
        update_cache: yes
        upgrade: dist

    - name: Install required packages
      apt:
        name:
          - mysql-server
          - mysql-client
          - python3-pymysql
          - unzip
          - curl
        state: present

    - name: Start and enable MySQL
      systemd:
        name: mysql
        state: started
        enabled: yes

    - name: Set MySQL root password
      mysql_user:
        login_unix_socket: /var/run/mysqld/mysqld.sock
        name: root
        password: "{{ mysql_root_password }}"
        state: present
      ignore_errors: yes

    - name: Create MySQL configuration file
      template:
        src: templates/mysql.cnf.j2
        dest: /etc/mysql/mysql.conf.d/mechuragi.cnf
        backup: yes
      notify: restart mysql

    - name: Create application database
      mysql_db:
        login_user: root
        login_password: "{{ mysql_root_password }}"
        name: "{{ mysql_database }}"
        state: present

    - name: Create application database user
      mysql_user:
        login_user: root
        login_password: "{{ mysql_root_password }}"
        name: "{{ mysql_app_user }}"
        password: "{{ mysql_app_password }}"
        priv: "{{ mysql_database }}.*:ALL"
        host: "%"
        state: present

    - name: Remove anonymous MySQL users
      mysql_user:
        login_user: root
        login_password: "{{ mysql_root_password }}"
        name: ""
        host_all: yes
        state: absent

    - name: Remove MySQL test database
      mysql_db:
        login_user: root
        login_password: "{{ mysql_root_password }}"
        name: test
        state: absent

    - name: Create MySQL backup directory
      file:
        path: /var/backups/mysql
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Setup MySQL backup script
      template:
        src: templates/mysql-backup.sh.j2
        dest: /usr/local/bin/mysql-backup.sh
        mode: '0700'
        owner: root
        group: root

    - name: Setup MySQL backup cron job
      cron:
        name: "MySQL backup"
        minute: "0"
        hour: "2"
        job: "/usr/local/bin/mysql-backup.sh"
        user: root

    - name: Setup log rotation for MySQL
      template:
        src: templates/mysql-logrotate.j2
        dest: /etc/logrotate.d/mysql-server
        mode: '0644'

  handlers:
    - name: restart mysql
      systemd:
        name: mysql
        state: restarted