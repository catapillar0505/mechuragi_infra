---
- name: 캐시 서버 구축
  hosts: cache
  become: yes
  vars_files:
    - ../group_vars/all/main.yml
  roles:
    - common
    - redis

  post_tasks:
    - name: Redis 연결 테스트
      command: redis-cli -h 127.0.0.1 -p {{ redis_port }} ping
      register: redis_ping_result
      ignore_errors: yes

    - name: Redis 연결 테스트 결과
      debug:
        msg: "Redis 연결: {{ 'SUCCESS' if redis_ping_result.rc == 0 else 'FAILED' }}"