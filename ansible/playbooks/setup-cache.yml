---
- name: 캐시 서버 구축
  hosts: cache
  become: yes
  vars_files:
    - ../group_vars/all/main.yml
  roles:
    - common
    - redis

  post_tasks:
    - name: Redis 서비스 상태 확인
      systemd:
        name: redis-server
        state: started
      register: redis_service_status
      ignore_errors: yes

    - name: Redis 프로세스 확인
      shell: ps aux | grep redis-server | grep -v grep
      register: redis_process
      ignore_errors: yes

    - name: Redis 포트 리스닝 확인
      shell: ss -tlnp | grep {{ redis_port }}
      register: redis_port_listen
      ignore_errors: yes

    - name: Redis bind 설정 확인
      shell: grep "^bind" /etc/redis/redis.conf 2>/dev/null || echo "not found"
      register: redis_bind_config
      ignore_errors: yes

    - name: Redis protected-mode 설정 확인
      shell: grep "^protected-mode" /etc/redis/redis.conf 2>/dev/null || echo "not found"
      register: redis_protected_mode_config
      ignore_errors: yes

    - name: Redis 메모리 설정 확인
      shell: redis-cli CONFIG GET maxmemory 2>/dev/null || echo "확인 불가"
      register: redis_memory_config
      ignore_errors: yes

    - name: Redis 연결 테스트 (로컬)
      command: redis-cli -h 127.0.0.1 -p {{ redis_port }} ping
      register: redis_ping_result
      ignore_errors: yes

    - name: Redis 버전 확인
      shell: redis-server --version
      register: redis_version
      ignore_errors: yes

    - name: Redis 설치 및 설정 검증 결과
      debug:
        msg: |

          ==========================================
          ⚡ Redis 캐시 서버 검증 결과
          ==========================================

          1. 서비스 상태:
             {{ '✅ Redis 서비스 실행 중' if redis_service_status is succeeded else '❌ Redis 서비스 중단됨' }}

          2. 프로세스 확인:
             {{ '✅ redis-server 프로세스 실행 중' if redis_process.rc == 0 else '❌ redis-server 프로세스 없음' }}

          3. 포트 리스닝 ({{ redis_port }}):
             {{ redis_port_listen.stdout if redis_port_listen.rc == 0 else '❌ 포트 ' + redis_port|string + ' 리스닝하지 않음' }}
             {% if '0.0.0.0:' + redis_port|string in redis_port_listen.stdout %}
             ✅ 모든 인터페이스에서 수신 (0.0.0.0:{{ redis_port }})
             {% elif '127.0.0.1:' + redis_port|string in redis_port_listen.stdout %}
             ⚠️  localhost에서만 수신 (외부 접근 불가)
             {% endif %}

          4. bind 설정:
             {{ redis_bind_config.stdout }}
             {% if '0.0.0.0' in redis_bind_config.stdout %}
             ✅ VPC 내부 접근 가능 (bind 0.0.0.0)
             {% elif '127.0.0.1' in redis_bind_config.stdout %}
             ❌ localhost만 허용 (bind 127.0.0.1)
             {% endif %}

          5. protected-mode 설정:
             {{ redis_protected_mode_config.stdout }}
             {% if 'yes' in redis_protected_mode_config.stdout %}
             ✅ 보호 모드 활성화 (protected-mode yes)
             {% elif 'no' in redis_protected_mode_config.stdout %}
             ⚠️  보호 모드 비활성화 (보안 주의)
             {% endif %}

          6. 메모리 설정:
             {{ redis_memory_config.stdout if redis_memory_config.rc == 0 else '확인 불가' }}

          7. 연결 테스트:
             {{ '✅ Redis 연결 성공 (PONG)' if redis_ping_result.rc == 0 and 'PONG' in redis_ping_result.stdout else '❌ Redis 연결 실패' }}

          8. Redis 버전:
             {{ redis_version.stdout if redis_version.rc == 0 else '확인 불가' }}

          {% if redis_service_status is succeeded and redis_process.rc == 0 and '0.0.0.0:' + redis_port|string in redis_port_listen.stdout and redis_ping_result.rc == 0 %}
          ✅ Redis 캐시 서버 설치 및 설정 완료!
          {% else %}
          ⚠️  일부 설정이 올바르지 않습니다. 위 내용을 확인하세요.
          {% endif %}