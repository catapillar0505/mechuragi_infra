---
- name: 메인 서비스 구축
  hosts: main_service
  become: yes
  vars_files:
    - ../group_vars/all/main.yml
  vars:
    app_name: "main-service"
    app_type: "main"
    app_docker_compose_template: "docker-compose-main-blue-green.yml.j2"
    app_env_template: "main-service.env.j2"
    app_health_check_url: "http://{{ ansible_default_ipv4.address }}:{{ main_service_port }}/actuator/health"
    nginx_site_name: "main-service"
    nginx_site_template: "nginx-main-service.conf.j2"
    blue_green_deploy_script: "blue-green-deploy.sh.j2"

  roles:
    - common
    - docker
    - nginx
    - application

  post_tasks:
    - name: 메인 서비스 상태 확인
      uri:
        url: "{{ app_health_check_url }}"
        method: GET
        timeout: 30
      register: main_service_health
      retries: 5
      delay: 10
      ignore_errors: yes

    - name: 메인 서비스 배포 결과
      debug:
        msg: |
          메인 서비스 배포 상태:
          - URL: {{ app_health_check_url }}
          - 상태: {{ 'HEALTHY' if (main_service_health.status is defined and main_service_health.status == 200) else 'UNHEALTHY' }}