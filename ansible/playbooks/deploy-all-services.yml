---
- name: 메추라기 인프라 배포 (MySQL, Redis)
  hosts: localhost
  gather_facts: no
  vars_files:
    - ../group_vars/all/main.yml
  tasks:
    - name: 인프라 정보 출력
      debug:
        msg: |
          🚀 메추라기 인프라 배포 시작
          =====================================
          📍 인스턴스 정보:

          1. Main Service Server
             - Public IP:  {{ hostvars[groups['main_service'][0]]['ansible_host'] }}
             - Private IP: {{ hostvars[groups['main_service'][0]]['private_ip'] }}
             - Type: {{ hostvars[groups['main_service'][0]]['server_type'] }}

          2. AI Service Server
             - Public IP:  {{ hostvars[groups['ai_service'][0]]['ansible_host'] }}
             - Private IP: {{ hostvars[groups['ai_service'][0]]['private_ip'] }}
             - Type: {{ hostvars[groups['ai_service'][0]]['server_type'] }}

          3. MySQL Database Server
             - Public IP:  {{ hostvars[groups['database'][0]]['ansible_host'] }}
             - Private IP: {{ hostvars[groups['database'][0]]['private_ip'] }}
             - Type: {{ hostvars[groups['database'][0]]['server_type'] }}

          4. Redis Cache Server
             - Public IP:  {{ hostvars[groups['cache'][0]]['ansible_host'] }}
             - Private IP: {{ hostvars[groups['cache'][0]]['private_ip'] }}
             - Type: {{ hostvars[groups['cache'][0]]['server_type'] }}

          =====================================
          🔧 배포할 컴포넌트:
          - MySQL Database (Ansible로 구축)
          - Redis Cache (Ansible로 구축)

          ℹ️  참고:
          - Main Service: GitHub Actions로 자동 배포
          - AI Service: GitHub Actions로 자동 배포

# 1단계: 데이터베이스 구축
- import_playbook: setup-database.yml

# 2단계: 캐시 구축
- import_playbook: setup-cache.yml

# 3단계: Main Service - Nginx 설치 및 시작
- name: Main Service - Nginx 설치 및 시작
  hosts: main_service
  become: yes
  gather_facts: no
  vars_files:
    - ../group_vars/all/main.yml
  tasks:
    - name: Main Service Nginx 설치 및 시작 메시지
      debug:
        msg: |
          ==========================================
          🌐 Main Service - Nginx 설치 및 시작
          ==========================================

    - name: Nginx 패키지 설치
      apt:
        name: nginx
        state: present
        update_cache: yes
      register: nginx_install
      ignore_errors: yes

    - name: Nginx 서비스 시작 및 활성화
      systemd:
        name: nginx
        state: started
        enabled: yes
      register: nginx_start
      ignore_errors: yes

    - name: Nginx 설정 파일 배포 (API만 처리)
      template:
        src: ../roles/nginx/templates/nginx-main-service.conf.j2
        dest: /etc/nginx/sites-available/main-service
        backup: yes
      register: nginx_config

    - name: 기본 Nginx 사이트 비활성화
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Nginx 사이트 활성화
      file:
        src: /etc/nginx/sites-available/main-service
        dest: /etc/nginx/sites-enabled/main-service
        state: link

    - name: Nginx 설정 테스트
      command: nginx -t
      register: nginx_test
      ignore_errors: yes

    - name: Nginx 재시작 (설정 변경 시)
      systemd:
        name: nginx
        state: restarted
      when: nginx_config.changed and nginx_test.rc == 0

    - name: Nginx 서비스 상태 확인
      shell: systemctl is-active nginx
      register: nginx_status
      ignore_errors: yes

    - name: Nginx 포트 리스닝 확인
      shell: ss -tlnp | grep :80
      register: nginx_port
      ignore_errors: yes

    - name: Main Service Nginx 시작 결과
      debug:
        msg: |

          🌐 Main Service - Nginx 서비스 상태:
          서비스: {{ '✅ 실행 중' if nginx_status.rc == 0 and nginx_status.stdout == 'active' else '❌ 중단됨 또는 미설치' }}
          포트 80: {{ '✅ 리스닝 중' if nginx_port.rc == 0 else '❌ 리스닝하지 않음' }}

          {% if nginx_status.rc == 0 and nginx_status.stdout == 'active' and nginx_port.rc == 0 %}
          ✅ Nginx가 정상적으로 시작되었습니다.
          {% else %}
          ⚠️  Nginx 시작 실패 - 수동으로 확인 필요
          해결: sudo systemctl start nginx
          {% endif %}

