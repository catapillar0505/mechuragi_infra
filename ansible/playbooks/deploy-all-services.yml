# 4단계: 서비스 시작 대기
- name: 인프라 서비스 시작 대기
  hosts: localhost
  gather_facts: no
  tasks:
    - name: MySQL, Redis 시작 대기
      pause:
        seconds: 10
        prompt: "MySQL, Redis 서비스 시작 대기 중..."

# 4단계: 인프라 연결성 검증
- name: 인프라 연결성 검증 (Main Service → MySQL, Redis)
  hosts: main_service
  gather_facts: no
  vars_files:
    - ../group_vars/all/main.yml
  tasks:
    - name: 연결성 테스트 시작
      debug:
        msg: |

          ==========================================
          🔍 인프라 연결성 검증 시작
          ==========================================
          Main Service → MySQL, Redis

    - name: MySQL 포트 연결 테스트
      wait_for:
        host: "{{ hostvars[groups['database'][0]]['private_ip'] }}"
        port: 3306
        timeout: 10
      ignore_errors: yes
      register: mysql_connectivity

    - name: Redis 포트 연결 테스트
      wait_for:
        host: "{{ hostvars[groups['cache'][0]]['private_ip'] }}"
        port: "{{ redis_port }}"
        timeout: 10
      ignore_errors: yes
      register: redis_connectivity

    - name: 인프라 배포 결과
      debug:
        msg: |

          ==========================================
          ✅ 메추라기 인프라 배포 완료
          ==========================================

          📍 배포 서버:
          - MySQL: {{ hostvars[groups['database'][0]]['private_ip'] }}:3306
          - Redis: {{ hostvars[groups['cache'][0]]['private_ip'] }}:{{ redis_port }}

          🌐 연결성 검증 결과 (from Main Service):

          1. MySQL ({{ hostvars[groups['database'][0]]['private_ip'] }}:3306)
             {{ '✅ 포트 연결 정상' if mysql_connectivity is succeeded else '❌ 포트 연결 실패' }}

          2. Redis ({{ hostvars[groups['cache'][0]]['private_ip'] }}:{{ redis_port }})
             {{ '✅ 포트 연결 정상' if redis_connectivity is succeeded else '❌ 포트 연결 실패' }}

          {% if mysql_connectivity is succeeded and redis_connectivity is succeeded %}
          ==========================================
          🎉 인프라 배포 및 연결 성공!
          ==========================================
          MySQL과 Redis가 정상적으로 구축되었습니다.

          ℹ️  다음 단계:
          1. Main Service: GitHub에 푸시하여 자동 배포
          2. AI Service: GitHub에 푸시하여 자동 배포
          3. 전체 연결성 테스트:
             ansible-playbook -i inventory/hosts.yml playbooks/test-connectivity.yml
          {% else %}
          ==========================================
          ⚠️  인프라 연결 실패
          ==========================================

          📋 상세 진단 실행:
          ansible-playbook -i inventory/hosts.yml playbooks/test-connectivity.yml
          {% endif %}