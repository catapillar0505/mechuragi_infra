- name: AWS 서비스 연동 설정 (서버 측)
  hosts: mechuragi-server
  become: yes
  gather_facts: yes
  roles:
    - aws-services

  tasks:
    - name: 설정 완료 메시지
      debug:
        msg:
          - "🎯 AWS 서비스 연동 설정 완료!"
          - ""
          - "📋 생성된 설정 파일:"
          - "  - {{ config_directory }}/bedrock_config.env"
          - "  - {{ config_directory }}/ses_config.env"
          - "  - {{ config_directory }}/cloudfront_config.env"