---
- name: AWS 서비스 연동 설정 (서버 측)
  hosts: mechuragi-server
  become: yes
  gather_facts: yes

  tasks:
    # Python 라이브러리 설치
    - name: 1. Python AWS SDK 설치
      pip:
        name:
          - boto3
          - botocore
        state: present

    # Bedrock 설정 파일 및 스크립트
    - name: 2. Bedrock 설정 파일 생성
      copy:
        content: |
          # AWS Bedrock Configuration for {{ project_name }}
          # Terraform에서 생성된 리소스 정보
          
          AWS_REGION={{ aws_region }}
          
          # Bedrock Model IDs (Parameter Store에서 가져오기)
          BEDROCK_CHAT_MODEL=anthropic.claude-3-haiku-20240307-v1:0
          BEDROCK_SMART_MODEL=anthropic.claude-3-sonnet-20240229-v1:0
          BEDROCK_EMBEDDING_MODEL=amazon.titan-embed-text-v1
          
          # Bedrock Endpoints
          BEDROCK_ENDPOINT=https://bedrock.{{ aws_region }}.amazonaws.com
          BEDROCK_RUNTIME_ENDPOINT=https://bedrock-runtime.{{ aws_region }}.amazonaws.com
          
          # Model Parameters
          MAX_TOKENS=1000
          TEMPERATURE=0.7
          TOP_P=0.9
          
          # Rate Limiting
          REQUESTS_PER_MINUTE=60
          CONCURRENT_REQUESTS=5
        dest: "{{ app_directory }}/bedrock_config.env"
        owner: ec2-user
        group: ec2-user
        mode: '0644'

    - name: 3. Bedrock 테스트 스크립트 생성
      copy:
        content: |
          #!/usr/bin/env python3
          import boto3
          import json
          import sys
          from datetime import datetime
          
          def test_bedrock_connection():
              try:
                  # Bedrock 클라이언트 생성
                  bedrock = boto3.client('bedrock', region_name='{{ aws_region }}')
                  bedrock_runtime = boto3.client('bedrock-runtime', region_name='{{ aws_region }}')
                  
                  print("🔍 Bedrock 연결 테스트 시작...")
                  
                  # 1. 사용 가능한 모델 목록 확인
                  print("\n📋 사용 가능한 Foundation Models:")
                  models = bedrock.list_foundation_models()
                  
                  for model in models['modelSummaries'][:5]:  # 처음 5개만 표시
                      print(f"  - {model['modelName']}: {model['modelId']}")
                  
                  # 2. Claude 3 Haiku 모델 테스트
                  model_id = "anthropic.claude-3-haiku-20240307-v1:0"
                  
                  test_prompt = {
                      "anthropic_version": "bedrock-2023-05-31",
                      "max_tokens": 100,
                      "messages": [
                          {
                              "role": "user",
                              "content": "{{ project_name }} 프로젝트를 위한 간단한 AI 추천 시스템에 대해 한 문장으로 설명해주세요."
                          }
                      ]
                  }
                  
                  print(f"\n🤖 Claude 3 Haiku 모델 테스트...")
                  response = bedrock_runtime.invoke_model(
                      modelId=model_id,
                      body=json.dumps(test_prompt),
                      contentType='application/json'
                  )
                  
                  response_body = json.loads(response['body'].read())
                  ai_response = response_body['content'][0]['text']
                  
                  print(f"✅ AI 응답: {ai_response}")
                  
                  print(f"\n🎉 Bedrock 연동 테스트 성공!")
                  print(f"   테스트 시간: {datetime.now().strftime('%Y-%m-%d %H:%M:%S')}")
                  
                  return True
                  
              except Exception as e:
                  print(f"❌ Bedrock 연동 실패: {str(e)}")
                  return False
          
          if __name__ == "__main__":
              success = test_bedrock_connection()
              sys.exit(0 if success else 1)
        dest: "{{ app_directory }}/test_bedrock.py"
        mode: '0755'
        owner: ec2-user
        group: ec2-user

    - name: 4. AI 추천 시스템 예제 코드 생성
      copy:
        content: |
          #!/usr/bin/env python3
          """
          {{ project_name }} AI 추천 시스템 예제 코드
          AWS Bedrock을 사용한 사용자 맞춤형 추천 생성
          """
          
          import boto3
          import json
          import logging
          from typing import List, Dict, Any
          
          class MechuragiAIRecommendation:
              def __init__(self, region_name: str = '{{ aws_region }}'):
                  self.bedrock_runtime = boto3.client('bedrock-runtime', region_name=region_name)
                  self.chat_model = "anthropic.claude-3-haiku-20240307-v1:0"
                  self.embedding_model = "amazon.titan-embed-text-v1"
                  
                  logging.basicConfig(level=logging.INFO)
                  self.logger = logging.getLogger(__name__)
          
              def generate_user_recommendations(self, user_profile: Dict[str, Any], 
                                              preferences: List[str], 
                                              history: List[str]) -> Dict[str, Any]:
                  """사용자 프로필 기반 맞춤형 추천 생성"""
                  
                  prompt = {
                      "anthropic_version": "bedrock-2023-05-31",
                      "max_tokens": 500,
                      "messages": [
                          {
                              "role": "user",
                              "content": f"""
                              {{ project_name }} 서비스의 사용자 추천 시스템입니다.
                              
                              사용자 정보:
                              - 나이: {user_profile.get('age', '미제공')}
                              - 성별: {user_profile.get('gender', '미제공')}
                              - 관심사: {', '.join(preferences)}
                              - 이전 활동: {', '.join(history)}
                              
                              이 사용자에게 맞는 5가지 추천 항목을 JSON 형태로 제공해주세요.
                              각 추천에는 제목, 설명, 이유, 점수(1-10)를 포함해주세요.
                              """
                          }
                      ]
                  }
                  
                  try:
                      response = self.bedrock_runtime.invoke_model(
                          modelId=self.chat_model,
                          body=json.dumps(prompt),
                          contentType='application/json'
                      )
                      
                      response_body = json.loads(response['body'].read())
                      recommendation = response_body['content'][0]['text']
                      
                      self.logger.info("AI 추천 생성 성공")
                      return {
                          "status": "success",
                          "recommendations": recommendation,
                          "model_used": self.chat_model
                      }
                      
                  except Exception as e:
                      self.logger.error(f"추천 생성 실패: {str(e)}")
                      return {
                          "status": "error",
                          "error": str(e)
                      }
          
              def create_content_embedding(self, content: str) -> List[float]:
                  """콘텐츠 임베딩 벡터 생성 (유사도 검색용)"""
                  
                  prompt = {
                      "inputText": content
                  }
                  
                  try:
                      response = self.bedrock_runtime.invoke_model(
                          modelId=self.embedding_model,
                          body=json.dumps(prompt),
                          contentType='application/json'
                      )
                      
                      response_body = json.loads(response['body'].read())
                      embedding = response_body['embedding']
                      
                      self.logger.info(f"임베딩 생성 성공: {len(embedding)} 차원")
                      return embedding
                      
                  except Exception as e:
                      self.logger.error(f"임베딩 생성 실패: {str(e)}")
                      return []
          
          # 사용 예제
          if __name__ == "__main__":
              ai_recommender = MechuragiAIRecommendation()
              
              # 테스트 사용자 데이터
              test_user = {
                  "age": 25,
                  "gender": "여성",
              }
              
              test_preferences = ["요리", "여행", "독서", "영화"]
              test_history = ["이탈리아 요리 레시피 검색", "제주도 여행 계획", "추리소설 추천"]
              
              # AI 추천 생성
              result = ai_recommender.generate_user_recommendations(
                  test_user, test_preferences, test_history
              )
              
              print("🤖 AI 추천 결과:")
              print(json.dumps(result, indent=2, ensure_ascii=False))
              
              # 콘텐츠 임베딩 테스트
              content = "맛있는 한국 전통 요리 레시피"
              embedding = ai_recommender.create_content_embedding(content)
              
              if embedding:
                  print(f"\n📊 임베딩 벡터 생성 완료: {len(embedding)} 차원")
        dest: "{{ app_directory }}/ai_recommendation_example.py"
        mode: '0755'
        owner: ec2-user
        group: ec2-user

    # SES 설정 파일
    - name: 5. SES 설정 파일 생성
      copy:
        content: |
          # AWS SES Configuration for {{ project_name }}
          # Terraform에서 생성된 리소스 정보
          
          AWS_REGION={{ aws_region }}
          
          # SES 설정 (Terraform 출력값 참조)
          SES_FROM_EMAIL={{ ses_from_email | default('noreply@your-domain.com') }}
          SES_CONFIGURATION_SET={{ project_name }}-{{ environment }}
          
          # 이메일 템플릿 이름
          WELCOME_EMAIL_TEMPLATE={{ project_name }}-welcome-email
          PASSWORD_RESET_TEMPLATE={{ project_name }}-password-reset
          
          # 이메일 발송 제한
          MAX_SEND_RATE=14  # 초당 최대 발송 수 (SES 기본값)
          MAX_24H_SEND=200  # 24시간 최대 발송 수 (SES 기본값)
        dest: "{{ app_directory }}/ses_config.env"
        owner: ec2-user
        group: ec2-user
        mode: '0644'

    - name: 6. SES 이메일 발송 예제 스크립트
      copy:
        content: |
          #!/usr/bin/env python3
          import boto3
          import json
          from datetime import datetime
          
          def send_welcome_email(to_email, user_name):
              """환영 이메일 발송"""
              
              ses_client = boto3.client('ses', region_name='{{ aws_region }}')
              
              try:
                  response = ses_client.send_templated_email(
                      Source='{{ ses_from_email | default("noreply@your-domain.com") }}',
                      Destination={
                          'ToAddresses': [to_email]
                      },
                      Template='{{ project_name }}-welcome-email',
                      TemplateData=json.dumps({
                          'name': user_name,
                          'project_name': '{{ project_name }}',
                          'app_url': 'https://your-app-url.com',
                          'support_email': 'support@your-domain.com'
                      }),
                      ConfigurationSetName='{{ project_name }}-{{ environment }}'
                  )
                  
                  print(f"✅ 환영 이메일 발송 성공: {response['ResponseMetadata']['RequestId']}")
                  return True
                  
              except Exception as e:
                  print(f"❌ 이메일 발송 실패: {str(e)}")
                  return False
          
          def send_password_reset_email(to_email, user_name, reset_link):
              """비밀번호 재설정 이메일 발송"""
              
              ses_client = boto3.client('ses', region_name='{{ aws_region }}')
              
              try:
                  response = ses_client.send_templated_email(
                      Source='{{ ses_from_email | default("noreply@your-domain.com") }}',
                      Destination={
                          'ToAddresses': [to_email]
                      },
                      Template='{{ project_name }}-password-reset',
                      TemplateData=json.dumps({
                          'name': user_name,
                          'project_name': '{{ project_name }}',
                          'reset_link': reset_link
                      }),
                      ConfigurationSetName='{{ project_name }}-{{ environment }}'
                  )
                  
                  print(f"✅ 비밀번호 재설정 이메일 발송 성공: {response['ResponseMetadata']['RequestId']}")
                  return True
                  
              except Exception as e:
                  print(f"❌ 이메일 발송 실패: {str(e)}")
                  return False
          
          # 테스트 실행
          if __name__ == "__main__":
              print("📧 SES 이메일 발송 테스트")
              
              # 환영 이메일 테스트
              test_email = "{{ test_email | default('test@example.com') }}"
              test_name = "테스트 사용자"
              
              print(f"\n1. 환영 이메일 발송 테스트 ({test_email})")
              send_welcome_email(test_email, test_name)
              
              print(f"\n2. 비밀번호 재설정 이메일 발송 테스트 ({test_email})")
              reset_link = "https://your-app-url.com/reset-password?token=test123"
              send_password_reset_email(test_email, test_name, reset_link)
        dest: "{{ app_directory }}/test_ses.py"
        mode: '0755'
        owner: ec2-user
        group: ec2-user

    # CloudFront 설정 파일
    - name: 7. CloudFront 설정 파일 생성
      copy:
        content: |
          # CloudFront Configuration for {{ project_name }}
          # Terraform에서 생성된 리소스 정보
          
          # CloudFront 배포 정보 (terraform output에서 가져오기)
          # CLOUDFRONT_DISTRIBUTION_ID=<terraform output>
          # CLOUDFRONT_DOMAIN_NAME=<terraform output>
          # CLOUDFRONT_URL=<terraform output>
          
          # S3 버킷 정보
          S3_BUCKET_NAME={{ s3_bucket_name }}
          
          # CDN 설정
          CACHE_BEHAVIORS=/images/*:604800,/api/*:0,/*:86400
          CLOUDFRONT_REGIONS=US,CA,EU
          
          # 파일 업로드 설정
          MAX_FILE_SIZE=10MB
          ALLOWED_FILE_TYPES=jpg,jpeg,png,gif,webp,svg
          
          # CloudFront 무효화 설정
          MAX_INVALIDATION_PATHS=1000
          INVALIDATION_COST_THRESHOLD=1000
        dest: "{{ app_directory }}/cloudfront_config.env"
        owner: ec2-user
        group: ec2-user
        mode: '0644'

    - name: 8. AWS 서비스 연결 테스트 실행
      command: python3 "{{ app_directory }}/test_bedrock.py"
      register: bedrock_test
      become_user: ec2-user
      ignore_errors: yes

    - name: 9. Bedrock 테스트 결과 출력
      debug:
        msg: "{{ bedrock_test.stdout_lines }}"
      when: bedrock_test.stdout_lines is defined

    - name: 10. 설정 완료 메시지
      debug:
        msg:
          - "🎯 AWS 서비스 연동 설정 완료!"
          - ""
          - "📋 생성된 설정 파일:"
          - "  - {{ app_directory }}/bedrock_config.env"
          - "  - {{ app_directory }}/ses_config.env"
          - "  - {{ app_directory }}/cloudfront_config.env"
          - ""
          - "🔧 생성된 테스트 스크립트:"
          - "  - {{ app_directory }}/test_bedrock.py"
          - "  - {{ app_directory }}/test_ses.py"
          - "  - {{ app_directory }}/ai_recommendation_example.py"
          - ""
          - "🚀 다음 단계:"
          - "  1. Terraform apply로 AWS 리소스 생성"
          - "  2. AWS 콘솔에서 Bedrock 모델 액세스 요청"
          - "  3. SES 도메인/이메일 인증 완료"
          - "  4. 애플리케이션에 설정 파일 통합"