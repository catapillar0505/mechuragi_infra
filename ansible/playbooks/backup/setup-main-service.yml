---
- name: 메인 서비스 구축 (SpringBoot + AWS SES + S3)
  hosts: main_service
  become: yes
  vars:
    service_name: "main-service"

  tasks:
    - name: Update system packages
      apt:
        update_cache: yes
        upgrade: dist

    - name: Install required packages
      apt:
        name:
          - docker.io
          - docker-compose
          - nginx
          - unzip
          - curl
          - git
        state: present

    - name: Start and enable Docker
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Create application directory
      file:
        path: "{{ app_directory }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Create config directory
      file:
        path: "{{ config_directory }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Setup nginx for reverse proxy
      template:
        src: templates/nginx-main-service.conf.j2
        dest: /etc/nginx/sites-available/main-service
        backup: yes
      notify: restart nginx

    - name: Enable nginx site
      file:
        src: /etc/nginx/sites-available/main-service
        dest: /etc/nginx/sites-enabled/main-service
        state: link
      notify: restart nginx

    - name: Remove default nginx site
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: restart nginx

    - name: Create docker-compose file for main service
      template:
        src: templates/docker-compose-main.yml.j2
        dest: "{{ app_directory }}/docker-compose.yml"
        owner: ubuntu
        group: ubuntu
        mode: '0644'

    - name: Create environment file for main service
      template:
        src: templates/main-service.env.j2
        dest: "{{ app_directory }}/.env"
        owner: ubuntu
        group: ubuntu
        mode: '0600'

  handlers:
    - name: restart nginx
      systemd:
        name: nginx
        state: restarted