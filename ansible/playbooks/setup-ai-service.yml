---
- name: AI 추천 서비스 구축
  hosts: ai_service
  become: yes
  vars_files:
    - ../group_vars/all/main.yml
  vars:
    app_name: "ai-service"
    app_type: "ai"
    app_docker_compose_template: "docker-compose-ai.yml.j2"
    app_env_template: "ai-service.env.j2"
    app_logrotate_template: "ai-service-logrotate.j2"
    app_health_check_url: "http://{{ ansible_default_ipv4.address }}:{{ ai_service_port }}/actuator/health"

  roles:
    - common
    - docker
    - application

  post_tasks:
    - name: AI 서비스 상태 확인
      uri:
        url: "{{ app_health_check_url }}"
        method: GET
        timeout: 30
      register: ai_service_health
      retries: 5
      delay: 10
      ignore_errors: yes

    - name: AI 서비스 배포 결과
      debug:
        msg: |
          AI 추천 서비스 배포 상태:
          - URL: {{ app_health_check_url }}
          - 상태: {{ 'HEALTHY' if (ai_service_health.status is defined and ai_service_health.status == 200) else 'UNHEALTHY' }}