---
- name: MySQL 데이터베이스 연결성 진단 테스트
  hosts: localhost
  gather_facts: no
  vars_files:
    - ../../group_vars/all/main.yml
  tasks:
    - name: 테스트 시작 메시지
      debug:
        msg: |
          🔍 MySQL 데이터베이스 연결성 진단 시작
          ==========================================
          테스트 단계:
          1. MySQL 서버 설정 확인
          2. Main 서비스에서 MySQL 연결 테스트
          3. AI 서비스에서 MySQL 연결 테스트
          4. 최종 요약 및 해결 방안

# ===== 1단계: MySQL 서버 설정 확인 =====
- name: "[1단계] MySQL 서버 설정 확인"
  hosts: database
  become: yes
  gather_facts: no
  vars_files:
    - ../../group_vars/all/main.yml
  tasks:
    - name: 1단계 시작 메시지
      debug:
        msg: |

          ==========================================
          1단계: MySQL 서버 설정 확인
          ==========================================

    - name: MySQL 서비스 상태 확인
      systemd:
        name: mysql
        state: started
      register: mysql_service_status
      ignore_errors: yes

    - name: MySQL 프로세스 확인
      shell: ps aux | grep mysqld | grep -v grep
      register: mysql_process
      ignore_errors: yes

    - name: MySQL 포트 리스닝 확인
      shell: ss -tlnp | grep 3306
      register: mysql_port_listen
      ignore_errors: yes

    - name: MySQL bind-address 설정 확인
      shell: grep -h "^bind-address" /etc/mysql/mysql.conf.d/*.cnf 2>/dev/null || echo "not found"
      register: mysql_bind_config
      ignore_errors: yes

    - name: MySQL 사용자 권한 확인
      shell: sudo mysql -e "SELECT user, host FROM mysql.user WHERE user='{{ mysql_app_user }}';"
      register: mysql_user_check
      ignore_errors: yes

    - name: MySQL 데이터베이스 확인
      shell: sudo mysql -e "SHOW DATABASES LIKE '{{ mysql_database }}';"
      register: mysql_db_check
      ignore_errors: yes

    - name: MySQL 연결 테스트 (로컬)
      mysql_db:
        login_user: "{{ mysql_app_user }}"
        login_password: "{{ mysql_app_password }}"
        name: "{{ mysql_database }}"
        state: present
      register: mysql_connection_test
      ignore_errors: yes

    - name: MySQL 버전 확인
      shell: mysql --version
      register: mysql_version
      ignore_errors: yes

    - name: 1단계 결과 출력
      debug:
        msg: |

          🗄️  MySQL 서버 설정 상태:

          1. 서비스 상태:
             {{ '✅ MySQL 서비스 실행 중' if mysql_service_status is succeeded else '❌ MySQL 서비스 중단됨' }}

          2. 프로세스 확인:
             {{ '✅ mysqld 프로세스 실행 중' if mysql_process.rc == 0 else '❌ mysqld 프로세스 없음' }}

          3. 포트 리스닝 (3306):
             {{ mysql_port_listen.stdout if mysql_port_listen.rc == 0 else '❌ 포트 3306 리스닝하지 않음' }}
             {% if '0.0.0.0:3306' in mysql_port_listen.stdout %}
             ✅ 모든 인터페이스에서 수신 (0.0.0.0:3306)
             {% elif '127.0.0.1:3306' in mysql_port_listen.stdout %}
             ⚠️  localhost에서만 수신 (외부 접근 불가)
             {% endif %}

          4. bind-address 설정:
             {{ mysql_bind_config.stdout }}
             {% if '0.0.0.0' in mysql_bind_config.stdout %}
             ✅ VPC 내부 접근 가능 (bind-address = 0.0.0.0)
             {% elif '127.0.0.1' in mysql_bind_config.stdout %}
             ❌ localhost만 허용 (bind-address = 127.0.0.1)
             {% endif %}

          5. 애플리케이션 사용자 권한:
             {{ mysql_user_check.stdout if mysql_user_check.rc == 0 else '❌ 사용자 확인 실패' }}
             {% if mysql_user_check.rc == 0 and '10.0.%' in mysql_user_check.stdout %}
             ✅ VPC 내부 접근 허용됨 (10.0.%)
             {% elif mysql_user_check.rc == 0 and 'localhost' in mysql_user_check.stdout %}
             ⚠️  localhost에서만 접근 가능
             {% endif %}

          6. 데이터베이스 존재:
             {{ '✅ ' + mysql_database + ' 데이터베이스 존재' if mysql_db_check.rc == 0 and mysql_database in mysql_db_check.stdout else '❌ 데이터베이스 없음' }}

          7. 연결 테스트 (로컬):
             {{ '✅ MySQL 연결 성공' if mysql_connection_test is succeeded else '❌ MySQL 연결 실패' }}

          8. MySQL 버전:
             {{ mysql_version.stdout if mysql_version.rc == 0 else '확인 불가' }}

# ===== 2단계: Main 서비스에서 MySQL 연결 테스트 =====
- name: "[2단계] Main 서비스에서 MySQL 연결 테스트"
  hosts: main_service
  become: yes
  gather_facts: no
  vars_files:
    - ../../group_vars/all/main.yml
  tasks:
    - name: 2단계 시작 메시지
      debug:
        msg: |

          ==========================================
          2단계: Main 서비스에서 MySQL 연결 테스트
          ==========================================

    - name: MySQL 클라이언트 설치 확인
      shell: which mysql
      register: mysql_client_check
      failed_when: false
      changed_when: false

    - name: MySQL 클라이언트 설치 (없는 경우)
      apt:
        name: mysql-client
        state: present
        update_cache: yes
      when: mysql_client_check.rc != 0

    - name: MySQL 포트 연결 테스트
      wait_for:
        host: "{{ hostvars[groups['database'][0]]['private_ip'] }}"
        port: 3306
        timeout: 10
      ignore_errors: yes
      register: mysql_port_connect

    - name: "→ MySQL 포트 연결"
      debug:
        msg: "{{ '✅ SUCCESS' if mysql_port_connect is succeeded else '❌ FAILED' }}"

    - name: MySQL 애플리케이션 연결 테스트
      shell: |
        mysql -h {{ hostvars[groups['database'][0]]['private_ip'] }} \
              -P 3306 \
              -u {{ mysql_app_user }} \
              -p{{ mysql_app_password }} \
              -e "SELECT 1 AS connection_test;" 2>&1
      register: mysql_app_connect
      ignore_errors: yes

    - name: "→ MySQL 애플리케이션 연결"
      debug:
        msg: "{{ '✅ SUCCESS' if mysql_app_connect.rc == 0 else '❌ FAILED: ' + (mysql_app_connect.stdout | default('')) }}"

    - name: 2단계 결과 출력
      debug:
        msg: |

          🧪 Main 서비스 → MySQL 연결 테스트 결과:

          1. MySQL ({{ hostvars[groups['database'][0]]['private_ip'] }}:3306)
             - 포트 연결: {{ '✅ SUCCESS' if mysql_port_connect is succeeded else '❌ FAILED - 타임아웃 또는 포트 닫힘' }}
             - 애플리케이션 연결: {{ '✅ SUCCESS' if mysql_app_connect.rc == 0 else '❌ FAILED' }}
             {% if mysql_app_connect.rc != 0 %}
             에러: {{ mysql_app_connect.stdout | default(mysql_app_connect.stderr) }}

             일반적인 에러:
             - ERROR 2003 (HY000) Can't connect (111): MySQL이 0.0.0.0:3306에서 리스닝하지 않음
             - ERROR 2003 (HY000) Can't connect (110): Connection timed out - Security Group 차단
             - ERROR 1045 (28000) Access denied: 사용자 권한 문제 - host 설정 확인 필요
             {% endif %}

# ===== 3단계: AI 서비스에서 MySQL 연결 테스트 =====
- name: "[3단계] AI 서비스에서 MySQL 연결 테스트"
  hosts: ai_service
  become: yes
  gather_facts: no
  vars_files:
    - ../../group_vars/all/main.yml
  tasks:
    - name: 3단계 시작 메시지
      debug:
        msg: |

          ==========================================
          3단계: AI 서비스에서 MySQL 연결 테스트
          ==========================================

    - name: MySQL 클라이언트 설치 확인
      shell: which mysql
      register: mysql_client_check
      failed_when: false
      changed_when: false

    - name: MySQL 클라이언트 설치 (없는 경우)
      apt:
        name: mysql-client
        state: present
        update_cache: yes
      when: mysql_client_check.rc != 0

    - name: MySQL 포트 연결 테스트
      wait_for:
        host: "{{ hostvars[groups['database'][0]]['private_ip'] }}"
        port: 3306
        timeout: 10
      ignore_errors: yes
      register: ai_mysql_port_connect

    - name: "→ MySQL 포트 연결"
      debug:
        msg: "{{ '✅ SUCCESS' if ai_mysql_port_connect is succeeded else '❌ FAILED' }}"

    - name: MySQL 애플리케이션 연결 테스트
      shell: |
        mysql -h {{ hostvars[groups['database'][0]]['private_ip'] }} \
              -P 3306 \
              -u {{ mysql_app_user }} \
              -p{{ mysql_app_password }} \
              -e "SELECT 1 AS connection_test;" 2>&1
      register: ai_mysql_app_connect
      ignore_errors: yes

    - name: "→ MySQL 애플리케이션 연결"
      debug:
        msg: "{{ '✅ SUCCESS' if ai_mysql_app_connect.rc == 0 else '❌ FAILED: ' + (ai_mysql_app_connect.stdout | default('')) }}"

    - name: 3단계 결과 출력
      debug:
        msg: |

          🤖 AI 서비스 → MySQL 연결 테스트 결과:

          1. MySQL ({{ hostvars[groups['database'][0]]['private_ip'] }}:3306)
             - 포트 연결: {{ '✅ SUCCESS' if ai_mysql_port_connect is succeeded else '❌ FAILED - 타임아웃 또는 포트 닫힘' }}
             - 애플리케이션 연결: {{ '✅ SUCCESS' if ai_mysql_app_connect.rc == 0 else '❌ FAILED' }}
             {% if ai_mysql_app_connect.rc != 0 %}
             에러: {{ ai_mysql_app_connect.stdout | default(ai_mysql_app_connect.stderr) }}

             일반적인 에러:
             - ERROR 2003 (HY000) Can't connect (111): MySQL이 0.0.0.0:3306에서 리스닝하지 않음
             - ERROR 2003 (HY000) Can't connect (110): Connection timed out - Security Group 차단
             - ERROR 1045 (28000) Access denied: 사용자 권한 문제 - host 설정 확인 필요
             {% endif %}

# ===== 4단계: 최종 요약 및 종합 결과 =====
- name: "[4단계] MySQL 연결성 최종 요약"
  hosts: database
  gather_facts: no
  vars_files:
    - ../../group_vars/all/main.yml
  tasks:
    - name: 최종 요약 메시지
      debug:
        msg: |

          ==========================================
          ✅ MySQL 데이터베이스 연결성 진단 완료
          ==========================================

          📍 MySQL 서버: {{ inventory_hostname }} ({{ hostvars[groups['database'][0]]['private_ip'] }})

          📋 테스트 단계별 체크리스트:
          - [1단계] ✅ MySQL 서버 설정 확인
          - [2단계] ✅ Main 서비스에서 MySQL 연결 테스트
          - [3단계] ✅ AI 서비스에서 MySQL 연결 테스트
          - [4단계] ✅ 최종 요약 및 해결 방안

          🌐 MySQL 연결성 최종 상태:

          1. Main Service → MySQL ({{ hostvars[groups['database'][0]]['private_ip'] }}:3306)
             {% set main_result = hostvars[groups['main_service'][0]] %}
             {{ '✅ 정상' if main_result.mysql_port_connect is succeeded and main_result.mysql_app_connect.rc == 0 else '❌ 실패' }}

          2. AI Service → MySQL ({{ hostvars[groups['database'][0]]['private_ip'] }}:3306)
             {% set ai_result = hostvars[groups['ai_service'][0]] %}
             {{ '✅ 정상' if ai_result.ai_mysql_port_connect is succeeded and ai_result.ai_mysql_app_connect.rc == 0 else '❌ 실패' }}

          {% set main_ok = hostvars[groups['main_service'][0]].mysql_port_connect is succeeded and hostvars[groups['main_service'][0]].mysql_app_connect.rc == 0 %}
          {% set ai_ok = hostvars[groups['ai_service'][0]].ai_mysql_port_connect is succeeded and hostvars[groups['ai_service'][0]].ai_mysql_app_connect.rc == 0 %}
          {% if main_ok and ai_ok %}
          ==========================================
          🎉 모든 서비스의 MySQL 연결 정상!
          ==========================================
          VPC 내부에서 MySQL 데이터베이스 통신이 정상적으로 작동하고 있습니다.
          {% else %}
          ==========================================
          ⚠️  일부 서비스의 MySQL 연결 실패
          ==========================================
          {% endif %}

          🔍 문제 해결 방법:

          1. MySQL 연결 실패 시:
             - MySQL 서비스 상태: sudo systemctl status mysql
             - bind-address = 0.0.0.0 확인: grep bind-address /etc/mysql/mysql.conf.d/*.cnf
             - 사용자 권한 10.0.% 확인: sudo mysql -e "SELECT user, host FROM mysql.user;"
             - Security Group 3306 포트 허용 확인 (AWS 콘솔)
             - 재배포: ansible-playbook -i inventory/hosts.yml playbooks/setup/setup-database.yml

          📚 추가 참고 자료:
          - VPC 내부 통신 문서: docs/vpc-internal-connectivity.md
          - MySQL 서버 상세 진단: ansible-playbook -i inventory/hosts.yml playbooks/test/test-connectivity.yml
