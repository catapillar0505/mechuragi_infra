---
- name: 프론트엔드 인프라 테스트 (S3, CloudFront)
  hosts: localhost
  gather_facts: no
  vars_files:
    - ../group_vars/all/main.yml
  vars:
    s3_images_bucket: "{{ project_name }}-{{ env }}-images"
    s3_frontend_bucket: "{{ project_name }}-{{ env }}-frontend"
    test_file_name: "ansible-test-{{ ansible_date_time.epoch }}.txt"
    test_file_content: "Ansible test file created at {{ ansible_date_time.iso8601 }}"

  tasks:
    - name: 테스트 시작 메시지
      debug:
        msg: |
          🔍 프론트엔드 인프라 테스트 시작
          ==========================================
          테스트 항목:
          1. S3 버킷 존재 및 상태 확인
          2. S3 파일 업로드 테스트
          3. CloudFront Distribution 상태 확인
          4. CloudFront 접근 테스트
          5. ACM 인증서 상태 확인
          6. 전체 프론트엔드 스택 검증
          ==========================================

# ===== 1단계: S3 버킷 존재 및 상태 확인 =====
- name: "[1단계] S3 버킷 존재 및 상태 확인"
  hosts: localhost
  gather_facts: no
  vars_files:
    - ../group_vars/all/main.yml
  vars:
    s3_images_bucket: "{{ project_name }}-{{ env }}-images"
    s3_frontend_bucket: "{{ project_name }}-{{ env }}-frontend"

  tasks:
    - name: 1단계 시작 메시지
      debug:
        msg: |

          ==========================================
          1단계: S3 버킷 존재 및 상태 확인
          ==========================================

    - name: S3 Images 버킷 존재 확인
      shell: aws s3 ls s3://{{ s3_images_bucket }} --region {{ aws_region }} 2>&1
      register: s3_images_exists
      ignore_errors: yes
      environment:
        AWS_REGION: "{{ aws_region }}"

    - name: "→ Images 버킷 존재"
      debug:
        msg: "{{ '✅ 존재함: ' + s3_images_bucket if s3_images_exists.rc == 0 else '❌ 존재하지 않음: ' + s3_images_bucket }}"

    - name: S3 Frontend 버킷 존재 확인
      shell: aws s3 ls s3://{{ s3_frontend_bucket }} --region {{ aws_region }} 2>&1
      register: s3_frontend_exists
      ignore_errors: yes
      environment:
        AWS_REGION: "{{ aws_region }}"

    - name: "→ Frontend 버킷 존재"
      debug:
        msg: "{{ '✅ 존재함: ' + s3_frontend_bucket if s3_frontend_exists.rc == 0 else '❌ 존재하지 않음: ' + s3_frontend_bucket }}"

    - name: S3 Images 버킷 버전 관리 확인
      shell: aws s3api get-bucket-versioning --bucket {{ s3_images_bucket }} --region {{ aws_region }} 2>&1
      register: s3_images_versioning
      ignore_errors: yes
      when: s3_images_exists.rc == 0
      environment:
        AWS_REGION: "{{ aws_region }}"

    - name: "→ Images 버킷 버전 관리"
      debug:
        msg: "{{ s3_images_versioning.stdout if s3_images_versioning.rc == 0 else '❌ 확인 불가' }}"
      when: s3_images_exists.rc == 0

    - name: S3 Images 버킷 암호화 확인
      shell: aws s3api get-bucket-encryption --bucket {{ s3_images_bucket }} --region {{ aws_region }} 2>&1
      register: s3_images_encryption
      ignore_errors: yes
      when: s3_images_exists.rc == 0
      environment:
        AWS_REGION: "{{ aws_region }}"

    - name: "→ Images 버킷 암호화"
      debug:
        msg: "{{ '✅ 암호화 활성화됨' if s3_images_encryption.rc == 0 else '⚠️  암호화 미설정' }}"
      when: s3_images_exists.rc == 0

    - name: S3 Images 버킷 Public Access Block 확인
      shell: aws s3api get-public-access-block --bucket {{ s3_images_bucket }} --region {{ aws_region }} 2>&1
      register: s3_images_public_access
      ignore_errors: yes
      when: s3_images_exists.rc == 0
      environment:
        AWS_REGION: "{{ aws_region }}"

    - name: "→ Images 버킷 Public Access Block"
      debug:
        msg: "{{ s3_images_public_access.stdout if s3_images_public_access.rc == 0 else '❌ 확인 불가' }}"
      when: s3_images_exists.rc == 0

    - name: S3 Frontend 버킷 파일 수 확인
      shell: aws s3 ls s3://{{ s3_frontend_bucket }} --recursive --region {{ aws_region }} | wc -l
      register: s3_frontend_file_count
      ignore_errors: yes
      when: s3_frontend_exists.rc == 0
      environment:
        AWS_REGION: "{{ aws_region }}"

    - name: "→ Frontend 버킷 파일 수"
      debug:
        msg: "{{ '✅ ' + s3_frontend_file_count.stdout + '개 파일' if s3_frontend_exists.rc == 0 and s3_frontend_file_count.rc == 0 else '❌ 확인 불가' }}"
      when: s3_frontend_exists.rc == 0

    - name: 1단계 결과 출력
      debug:
        msg: |

          📦 S3 버킷 상태:

          Images 버킷 ({{ s3_images_bucket }}):
          - 존재: {{ '✅' if s3_images_exists.rc == 0 else '❌' }}
          - 암호화: {{ '✅' if s3_images_exists.rc == 0 and s3_images_encryption.rc == 0 else '⚠️' }}

          Frontend 버킷 ({{ s3_frontend_bucket }}):
          - 존재: {{ '✅' if s3_frontend_exists.rc == 0 else '❌' }}
          - 파일 수: {{ s3_frontend_file_count.stdout if s3_frontend_exists.rc == 0 and s3_frontend_file_count.rc == 0 else '확인 불가' }}

          {% if s3_images_exists.rc == 0 and s3_frontend_exists.rc == 0 %}
          ✅ S3 버킷 정상
          {% else %}
          ❌ S3 버킷 문제 발견
          {% endif %}

# ===== 2단계: S3 파일 업로드 테스트 =====
- name: "[2단계] S3 파일 업로드 테스트"
  hosts: localhost
  gather_facts: yes
  vars_files:
    - ../group_vars/all/main.yml
  vars:
    s3_images_bucket: "{{ project_name }}-{{ env }}-images"
    test_file_name: "ansible-test-{{ ansible_date_time.epoch }}.txt"
    test_file_content: "Ansible test file created at {{ ansible_date_time.iso8601 }}"

  tasks:
    - name: 2단계 시작 메시지
      debug:
        msg: |

          ==========================================
          2단계: S3 파일 업로드 테스트
          ==========================================

    - name: 임시 테스트 파일 생성
      copy:
        content: "{{ test_file_content }}"
        dest: "/tmp/{{ test_file_name }}"
      register: test_file_created

    - name: "→ 테스트 파일 생성"
      debug:
        msg: "{{ '✅ 생성됨: /tmp/' + test_file_name if test_file_created is succeeded else '❌ 생성 실패' }}"

    - name: S3에 테스트 파일 업로드
      shell: |
        aws s3 cp /tmp/{{ test_file_name }} s3://{{ s3_images_bucket }}/test/{{ test_file_name }} \
          --region {{ aws_region }} 2>&1
      register: s3_upload
      ignore_errors: yes
      environment:
        AWS_REGION: "{{ aws_region }}"

    - name: "→ S3 업로드 결과"
      debug:
        msg: "{{ '✅ 업로드 성공' if s3_upload.rc == 0 else '❌ 업로드 실패: ' + s3_upload.stdout }}"

    - name: S3에서 업로드된 파일 확인
      shell: aws s3 ls s3://{{ s3_images_bucket }}/test/{{ test_file_name }} --region {{ aws_region }} 2>&1
      register: s3_file_check
      ignore_errors: yes
      when: s3_upload.rc == 0
      environment:
        AWS_REGION: "{{ aws_region }}"

    - name: "→ 파일 존재 확인"
      debug:
        msg: "{{ '✅ 파일 존재함' if s3_upload.rc == 0 and s3_file_check.rc == 0 else '❌ 파일 없음' }}"

    - name: S3에서 테스트 파일 다운로드
      shell: aws s3 cp s3://{{ s3_images_bucket }}/test/{{ test_file_name }} /tmp/{{ test_file_name }}.downloaded --region {{ aws_region }} 2>&1
      register: s3_download
      ignore_errors: yes
      when: s3_upload.rc == 0 and s3_file_check.rc == 0
      environment:
        AWS_REGION: "{{ aws_region }}"

    - name: "→ S3 다운로드 결과"
      debug:
        msg: "{{ '✅ 다운로드 성공' if s3_download.rc == 0 else '❌ 다운로드 실패' }}"
      when: s3_upload.rc == 0 and s3_file_check.rc == 0

    - name: 다운로드된 파일 내용 확인
      shell: cat /tmp/{{ test_file_name }}.downloaded
      register: downloaded_content
      ignore_errors: yes
      when: s3_download is defined and s3_download.rc == 0

    - name: "→ 파일 내용 일치 확인"
      debug:
        msg: "{{ '✅ 내용 일치' if downloaded_content.rc == 0 and test_file_content in downloaded_content.stdout else '❌ 내용 불일치' }}"
      when: s3_download is defined and s3_download.rc == 0

    - name: 테스트 파일 정리 (S3)
      shell: aws s3 rm s3://{{ s3_images_bucket }}/test/{{ test_file_name }} --region {{ aws_region }} 2>&1
      register: s3_cleanup
      ignore_errors: yes
      when: s3_upload.rc == 0
      environment:
        AWS_REGION: "{{ aws_region }}"

    - name: 테스트 파일 정리 (로컬)
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/tmp/{{ test_file_name }}"
        - "/tmp/{{ test_file_name }}.downloaded"
      ignore_errors: yes

    - name: 2단계 결과 출력
      debug:
        msg: |

          📤 S3 업로드/다운로드 테스트:

          - 파일 생성: {{ '✅' if test_file_created is succeeded else '❌' }}
          - S3 업로드: {{ '✅' if s3_upload.rc == 0 else '❌' }}
          - 파일 확인: {{ '✅' if s3_file_check.rc is defined and s3_file_check.rc == 0 else '❌' if s3_upload.rc == 0 else 'N/A' }}
          - S3 다운로드: {{ '✅' if s3_download.rc is defined and s3_download.rc == 0 else '❌' if s3_download is defined else 'N/A' }}
          - 내용 일치: {{ '✅' if downloaded_content.rc is defined and downloaded_content.rc == 0 and test_file_content in downloaded_content.stdout else '❌' if downloaded_content is defined else 'N/A' }}

          {% if s3_upload.rc == 0 and s3_download.rc is defined and s3_download.rc == 0 %}
          ✅ S3 업로드/다운로드 정상
          {% else %}
          ❌ S3 업로드/다운로드 실패
          {% endif %}

# ===== 3단계: CloudFront Distribution 상태 확인 =====
- name: "[3단계] CloudFront Distribution 상태 확인"
  hosts: localhost
  gather_facts: no
  vars_files:
    - ../group_vars/all/main.yml
  vars:
    s3_frontend_bucket: "{{ project_name }}-{{ env }}-frontend"

  tasks:
    - name: 3단계 시작 메시지
      debug:
        msg: |

          ==========================================
          3단계: CloudFront Distribution 상태 확인
          ==========================================

    - name: CloudFront Distribution ID 설정
      set_fact:
        cloudfront_id: "{{ cloudfront_distribution_id }}"

    - name: "→ Distribution ID"
      debug:
        msg: "✅ {{ cloudfront_id }}"

    - name: CloudFront Distribution 존재 확인
      shell: aws cloudfront get-distribution --id {{ cloudfront_id }} --region us-east-1 --query "Distribution.{ID:Id,DomainName:DomainName,Status:Status}" --output json 2>&1
      register: cloudfront_check
      ignore_errors: yes
      environment:
        AWS_REGION: us-east-1

    - name: "→ CloudFront 존재 확인"
      debug:
        msg: "{{ '✅ 존재함' if cloudfront_check.rc == 0 else '❌ 존재하지 않음: ' + cloudfront_check.stderr }}"

    - name: CloudFront Distribution 상세 정보 조회
      shell: aws cloudfront get-distribution --id {{ cloudfront_id }} --region us-east-1 --output json 2>&1
      register: cloudfront_detail
      ignore_errors: yes
      when: cloudfront_id is defined
      environment:
        AWS_REGION: us-east-1

    - name: CloudFront Distribution 상태 추출
      set_fact:
        cloudfront_status: "{{ (cloudfront_detail.stdout | from_json).Distribution.Status }}"
        cloudfront_domain: "{{ (cloudfront_detail.stdout | from_json).Distribution.DomainName }}"
        cloudfront_enabled: "{{ (cloudfront_detail.stdout | from_json).Distribution.DistributionConfig.Enabled }}"
      when: cloudfront_detail.rc is defined and cloudfront_detail.rc == 0
      ignore_errors: yes

    - name: "→ CloudFront 상태"
      debug:
        msg: |
          {% if cloudfront_status is defined %}
          ID: {{ cloudfront_id }}
          도메인: {{ cloudfront_domain }}
          상태: {{ cloudfront_status }}
          활성화: {{ cloudfront_enabled }}
          {% else %}
          ❌ 상태 확인 불가
          {% endif %}

    - name: CloudFront Origins 확인
      shell: aws cloudfront get-distribution-config --id {{ cloudfront_id }} --region us-east-1 --query "DistributionConfig.Origins.Items[*].{DomainName:DomainName,Id:Id}" --output json 2>&1
      register: cloudfront_origins
      ignore_errors: yes
      when: cloudfront_check.rc is defined and cloudfront_check.rc == 0
      environment:
        AWS_REGION: us-east-1

    - name: "→ CloudFront Origins"
      debug:
        msg: "{{ cloudfront_origins.stdout if cloudfront_origins.rc is defined and cloudfront_origins.rc == 0 else '❌ 확인 불가' }}"
      when: cloudfront_check.rc is defined and cloudfront_check.rc == 0

    - name: 3단계 결과 출력
      debug:
        msg: |

          ☁️  CloudFront Distribution 상태:

          {% if cloudfront_id is defined %}
          - Distribution ID: {{ cloudfront_id }}
          - 도메인: {{ cloudfront_domain if cloudfront_domain is defined else '확인 불가' }}
          - 상태: {{ cloudfront_status if cloudfront_status is defined else '확인 불가' }}
          - 활성화: {{ '✅' if cloudfront_enabled is defined and cloudfront_enabled else '❌' }}

          {% if cloudfront_status is defined and cloudfront_status == 'Deployed' %}
          ✅ CloudFront Distribution 정상 배포됨
          {% elif cloudfront_status is defined %}
          ⚠️  CloudFront 배포 중 (상태: {{ cloudfront_status }})
          {% else %}
          ❌ CloudFront 상태 확인 불가
          {% endif %}
          {% else %}
          ❌ CloudFront Distribution을 찾을 수 없음
          {% endif %}

# ===== 4단계: CloudFront 접근 테스트 =====
- name: "[4단계] CloudFront 접근 테스트"
  hosts: localhost
  gather_facts: no
  vars_files:
    - ../group_vars/all/main.yml

  tasks:
    - name: 4단계 시작 메시지
      debug:
        msg: |

          ==========================================
          4단계: CloudFront 접근 테스트
          ==========================================

    - name: CloudFront 도메인 설정
      set_fact:
        cf_domain: "{{ cloudfront_domain if cloudfront_domain is defined else cloudfront_domain_name }}"

    - name: CloudFront 도메인 HTTP 접근 테스트
      uri:
        url: "http://{{ cf_domain }}"
        method: GET
        status_code: [200, 301, 302, 403, 404]
        timeout: 30
      register: cloudfront_http_test
      ignore_errors: yes

    - name: "→ CloudFront HTTP 접근"
      debug:
        msg: "{{ '✅ 접근 가능 (HTTP ' + cloudfront_http_test.status|string + ')' if cloudfront_http_test.status is defined else '❌ 접근 불가' }}"

    - name: CloudFront 도메인 HTTPS 접근 테스트
      uri:
        url: "https://{{ cf_domain }}"
        method: GET
        status_code: [200, 301, 302, 403, 404]
        timeout: 30
        validate_certs: yes
      register: cloudfront_https_test
      ignore_errors: yes

    - name: "→ CloudFront HTTPS 접근"
      debug:
        msg: "{{ '✅ 접근 가능 (HTTP ' + cloudfront_https_test.status|string + ')' if cloudfront_https_test.status is defined else '❌ 접근 불가' }}"

    - name: CloudFront 응답 헤더 확인 (캐시 헤더)
      shell: curl -I https://{{ cf_domain }} 2>&1 | grep -i "x-cache\|x-amz-cf-id\|age"
      register: cloudfront_cache_headers
      ignore_errors: yes
      when: cloudfront_https_test.status is defined

    - name: "→ CloudFront 캐시 헤더"
      debug:
        msg: "{{ cloudfront_cache_headers.stdout_lines if cloudfront_cache_headers.rc is defined and cloudfront_cache_headers.rc == 0 else '❌ 확인 불가' }}"
      when: cloudfront_https_test.status is defined

    - name: 4단계 결과 출력
      debug:
        msg: |

          🌐 CloudFront 접근 테스트:

          도메인: {{ cf_domain }}
          - HTTP 접근: {{ '✅ (상태: ' + cloudfront_http_test.status|string + ')' if cloudfront_http_test.status is defined else '❌' }}
          - HTTPS 접근: {{ '✅ (상태: ' + cloudfront_https_test.status|string + ')' if cloudfront_https_test.status is defined else '❌' }}

          {% if cloudfront_cache_headers.rc is defined and cloudfront_cache_headers.rc == 0 %}
          캐시 헤더:
          {{ cloudfront_cache_headers.stdout }}
          {% endif %}

          {% if cloudfront_https_test.status is defined %}
          ✅ CloudFront 접근 정상
          {% else %}
          ❌ CloudFront 접근 실패
          {% endif %}

# ===== 5단계: ACM 인증서 상태 확인 =====
- name: "[5단계] ACM 인증서 상태 확인"
  hosts: localhost
  gather_facts: no
  vars_files:
    - ../group_vars/all/main.yml

  tasks:
    - name: 5단계 시작 메시지
      debug:
        msg: |

          ==========================================
          5단계: ACM 인증서 상태 확인
          ==========================================

    - name: ACM 인증서 목록 조회 (us-east-1, CloudFront용)
      shell: |
        aws acm list-certificates --region us-east-1 --query "CertificateSummaryList[?DomainName=='{{ ses_domain }}' || DomainName=='*.{{ ses_domain }}'].{DomainName:DomainName,CertificateArn:CertificateArn,Status:Status}" --output json 2>&1
      register: acm_list
      ignore_errors: yes
      environment:
        AWS_REGION: us-east-1

    - name: "→ ACM 인증서 조회"
      debug:
        msg: "{{ acm_list.stdout if acm_list.rc == 0 else '❌ 조회 실패' }}"

    - name: ACM 인증서 ARN 추출
      set_fact:
        acm_arn: "{{ (acm_list.stdout | from_json)[0].CertificateArn }}"
      when: acm_list.rc == 0 and (acm_list.stdout | from_json | length > 0)
      ignore_errors: yes

    - name: "→ 인증서 ARN"
      debug:
        msg: "{{ '✅ ' + acm_arn if acm_arn is defined else '❌ 찾을 수 없음' }}"

    - name: ACM 인증서 상세 정보 조회
      shell: aws acm describe-certificate --certificate-arn {{ acm_arn }} --region us-east-1 --output json 2>&1
      register: acm_detail
      ignore_errors: yes
      when: acm_arn is defined
      environment:
        AWS_REGION: us-east-1

    - name: ACM 인증서 상태 추출
      set_fact:
        acm_status: "{{ (acm_detail.stdout | from_json).Certificate.Status }}"
        acm_domain: "{{ (acm_detail.stdout | from_json).Certificate.DomainName }}"
        acm_in_use: "{{ (acm_detail.stdout | from_json).Certificate.InUseBy | length > 0 }}"
      when: acm_detail.rc is defined and acm_detail.rc == 0
      ignore_errors: yes

    - name: "→ 인증서 상태"
      debug:
        msg: |
          {% if acm_status is defined %}
          도메인: {{ acm_domain }}
          상태: {{ acm_status }}
          사용 중: {{ '✅' if acm_in_use else '❌' }}
          {% else %}
          ❌ 상태 확인 불가
          {% endif %}

    - name: 5단계 결과 출력
      debug:
        msg: |

          🔒 ACM 인증서 상태:

          {% if acm_arn is defined %}
          - ARN: {{ acm_arn }}
          - 도메인: {{ acm_domain if acm_domain is defined else '확인 불가' }}
          - 상태: {{ acm_status if acm_status is defined else '확인 불가' }}
          - CloudFront 사용: {{ '✅' if acm_in_use is defined and acm_in_use else '❌' }}

          {% if acm_status is defined and acm_status == 'ISSUED' %}
          ✅ ACM 인증서 정상 발급됨
          {% elif acm_status is defined %}
          ⚠️  ACM 인증서 상태: {{ acm_status }}
          {% else %}
          ❌ ACM 인증서 상태 확인 불가
          {% endif %}
          {% else %}
          ❌ ACM 인증서를 찾을 수 없음
          {% endif %}

# ===== 6단계: 최종 요약 =====
- name: "[6단계] 최종 요약 및 종합 결과"
  hosts: localhost
  gather_facts: no
  vars_files:
    - ../group_vars/all/main.yml

  tasks:
    - name: 최종 프론트엔드 스택 상태 종합
      set_fact:
        all_frontend_healthy: "{{
          (s3_images_exists.rc is defined and s3_images_exists.rc == 0) and
          (s3_frontend_exists.rc is defined and s3_frontend_exists.rc == 0) and
          (s3_upload.rc is defined and s3_upload.rc == 0) and
          (cloudfront_id is defined) and
          (cloudfront_status is defined and cloudfront_status == 'Deployed') and
          (cloudfront_https_test.status is defined)
        }}"
      ignore_errors: yes

    - name: 최종 요약 메시지
      debug:
        msg: |

          ==========================================
          ✅ 프론트엔드 인프라 테스트 완료
          ==========================================

          📋 테스트 결과 요약:

          1. S3 버킷 상태:
             - Images 버킷: {{ '✅' if s3_images_exists.rc == 0 else '❌' }}
             - Frontend 버킷: {{ '✅' if s3_frontend_exists.rc == 0 else '❌' }}

          2. S3 업로드/다운로드:
             - 업로드: {{ '✅' if s3_upload.rc == 0 else '❌' }}
             - 다운로드: {{ '✅' if s3_download.rc is defined and s3_download.rc == 0 else '❌' if s3_download is defined else 'N/A' }}

          3. CloudFront Distribution:
             - 존재: {{ '✅' if cloudfront_id is defined else '❌' }}
             - 상태: {{ cloudfront_status if cloudfront_status is defined else '❌ 확인 불가' }}
             - 도메인: {{ cloudfront_domain if cloudfront_domain is defined else cloudfront_domain_name }}

          4. CloudFront 접근:
             - HTTPS: {{ '✅' if cloudfront_https_test.status is defined else '❌' }}

          5. ACM 인증서:
             - 상태: {{ acm_status if acm_status is defined else '❌ 확인 불가' }}

          {% if all_frontend_healthy %}
          ==========================================
          🎉 프론트엔드 인프라 모두 정상!
          ==========================================
          S3, CloudFront, ACM이 정상적으로 작동하고 있습니다.
          {% else %}
          ==========================================
          ⚠️  일부 프론트엔드 인프라 문제 발견
          ==========================================
          {% endif %}

          🔍 문제 해결 방법:

          1. S3 버킷 문제:
             - 버킷 존재 확인: aws s3 ls
             - 재생성: cd terraform/environments/dev && terraform apply -target=module.s3

          2. CloudFront 문제:
             - Distribution 확인: aws cloudfront list-distributions --region us-east-1
             - 재생성: cd terraform/environments/dev && terraform apply -target=module.cloudfront

          3. ACM 인증서 문제:
             - 인증서 확인: aws acm list-certificates --region us-east-1
             - DNS 검증 확인: kro.kr DNS 관리 페이지에서 CNAME 레코드 설정 확인
             - 재생성: cd terraform/environments/dev && terraform apply -target=module.acm_certificate

          4. 전체 재배포:
             cd terraform/environments/dev
             terraform plan
             terraform apply

          📚 유용한 링크:
          {% if cf_domain is defined %}
          - CloudFront URL: https://{{ cf_domain }}
          {% endif %}
          - S3 Images: https://s3.console.aws.amazon.com/s3/buckets/{{ s3_images_bucket }}
          - S3 Frontend: https://s3.console.aws.amazon.com/s3/buckets/{{ s3_frontend_bucket }}
