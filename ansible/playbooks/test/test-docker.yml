---
- name: Docker 설치 검증 테스트
  hosts: main_service,ai_service
  gather_facts: no
  vars_files:
    - ../../group_vars/all/main.yml
  tasks:
    - name: 테스트 시작 메시지
      debug:
        msg: |
          🔍 Docker 설치 검증 시작
          ==========================================
          테스트 대상:
          - Main Service 서버
          - AI Service 서버

# ===== Docker 설치 검증 =====
- name: "[검증] Docker 설치 및 설정 확인"
  hosts: main_service,ai_service
  become: yes
  gather_facts: no
  vars_files:
    - ../../group_vars/all/main.yml
  tasks:
    - name: Docker 버전 확인
      command: docker --version
      register: docker_version
      ignore_errors: yes

    - name: Docker 서비스 상태 확인
      systemd:
        name: docker
      register: docker_service_status
      ignore_errors: yes

    - name: Docker 프로세스 확인
      shell: ps aux | grep dockerd | grep -v grep
      register: docker_process
      ignore_errors: yes

    - name: Docker 소켓 확인
      stat:
        path: /var/run/docker.sock
      register: docker_socket

    - name: Docker 그룹 확인
      shell: getent group docker
      register: docker_group
      ignore_errors: yes

    - name: 현재 사용자의 Docker 그룹 멤버십 확인
      shell: groups {{ ansible_user }}
      register: user_groups
      ignore_errors: yes

    - name: Docker 이미지 목록 확인
      command: docker images
      register: docker_images
      ignore_errors: yes

    - name: Docker 컨테이너 목록 확인
      command: docker ps -a
      register: docker_containers
      ignore_errors: yes

    - name: Docker 네트워크 확인
      command: docker network ls
      register: docker_networks
      ignore_errors: yes

    - name: Docker 볼륨 확인
      command: docker volume ls
      register: docker_volumes
      ignore_errors: yes

    - name: Docker 시스템 정보
      command: docker info
      register: docker_info
      ignore_errors: yes

    - name: Docker 검증 결과
      debug:
        msg: |

          ==========================================
          🐳 {{ inventory_hostname }} - Docker 검증 결과
          ==========================================

          1. Docker 버전:
             {{ docker_version.stdout if docker_version.rc == 0 else '❌ Docker 설치되지 않음' }}

          2. 서비스 상태:
             {{ '✅ Docker 서비스 실행 중' if docker_service_status.status.ActiveState == 'active' else '❌ Docker 서비스 중단됨' }}

          3. 프로세스 확인:
             {{ '✅ dockerd 프로세스 실행 중' if docker_process.rc == 0 else '❌ dockerd 프로세스 없음' }}

          4. Docker 소켓:
             {{ '✅ /var/run/docker.sock 존재' if docker_socket.stat.exists else '❌ Docker 소켓 없음' }}

          5. Docker 그룹:
             {{ '✅ docker 그룹 존재' if docker_group.rc == 0 else '❌ docker 그룹 없음' }}

          6. 사용자 권한:
             {{ user_groups.stdout }}
             {{ '✅ ' + ansible_user + ' 사용자가 docker 그룹에 속함' if 'docker' in user_groups.stdout else '⚠️  ' + ansible_user + ' 사용자가 docker 그룹에 속하지 않음 (sudo 필요)' }}

          7. Docker 이미지:
             {{ '✅ 이미지 목록 조회 가능' if docker_images.rc == 0 else '❌ 이미지 조회 실패' }}
             {% if docker_images.rc == 0 %}
             {{ docker_images.stdout_lines | length - 1 }}개의 이미지 존재
             {% endif %}

          8. Docker 컨테이너:
             {{ '✅ 컨테이너 목록 조회 가능' if docker_containers.rc == 0 else '❌ 컨테이너 조회 실패' }}
             {% if docker_containers.rc == 0 %}
             {{ docker_containers.stdout_lines | length - 1 }}개의 컨테이너 존재
             {% endif %}

          9. Docker 네트워크:
             {{ '✅ 네트워크 조회 가능' if docker_networks.rc == 0 else '❌ 네트워크 조회 실패' }}

          10. Docker 볼륨:
              {{ '✅ 볼륨 조회 가능' if docker_volumes.rc == 0 else '❌ 볼륨 조회 실패' }}

          {% if docker_version.rc == 0 and docker_service_status.status.ActiveState == 'active' and docker_process.rc == 0 and docker_socket.stat.exists %}
          ✅ Docker 설치 및 설정 정상!
          {% else %}
          ⚠️  일부 설정이 올바르지 않습니다. 위 내용을 확인하세요.
          {% endif %}

# ===== 최종 요약 =====
- name: "[최종] Docker 검증 요약"
  hosts: localhost
  gather_facts: no
  tasks:
    - name: 최종 요약 메시지
      debug:
        msg: |

          ==========================================
          ✅ Docker 설치 검증 완료
          ==========================================

          테스트 완료 서버:
          - Main Service 서버
          - AI Service 서버

          📚 추가 참고:
          - Docker 재설치: ansible-playbook -i inventory/hosts.yml playbooks/setup/setup-docker-only.yml
          - 서비스 배포는 GitHub Actions를 통해 자동으로 수행됩니다
