---
- name: Docker 설치 (메인/AI 서비스)
  hosts: main_service,ai_service
  become: yes
  vars_files:
    - ../group_vars/all/main.yml
  roles:
    - docker

  tasks:
    - name: Docker 설치 확인
      command: docker --version
      register: docker_version

    - name: Docker 서비스 상태 확인
      service:
        name: docker
        state: started
        enabled: yes

    - name: Docker 설치 완료 메시지
      debug:
        msg: "✅ {{ inventory_hostname }}: {{ docker_version.stdout }}"