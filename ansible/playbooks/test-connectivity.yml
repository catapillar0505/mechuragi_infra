---
- name: 메추라기 VPC 내부 연결성 진단 테스트
  hosts: localhost
  gather_facts: no
  vars_files:
    - ../group_vars/all/main.yml
  tasks:
    - name: 테스트 시작 메시지
      debug:
        msg: |
          🔍 메추라기 VPC 내부 연결성 진단 시작
          ==========================================
          테스트 단계:
          1. 기본 네트워크 연결 (ICMP Ping)
          2. TCP 포트 연결 테스트
          3. MySQL 서버 상세 설정 확인 (Ansible 구축)
          4. Redis 서버 상세 설정 확인 (Ansible 구축)
          5. AI 서비스 실행 상태 확인 (GitHub Actions 배포)
          6. Main 서비스 실행 상태 확인 (GitHub Actions 배포)
          7. 실제 서비스 연결 테스트 (포트 + 애플리케이션)
          8. 최종 요약 및 해결 방안

# ===== 1단계: 기본 네트워크 연결 테스트 (ICMP) =====
- name: "[1단계] 기본 네트워크 연결 테스트"
  hosts: main_service
  gather_facts: no
  vars_files:
    - ../group_vars/all/main.yml
  tasks:
    - name: 1단계 시작 메시지
      debug:
        msg: |

          ==========================================
          1단계: 기본 네트워크 연결 테스트 (ICMP Ping)
          ==========================================

    - name: MySQL 서버 Ping 테스트
      shell: ping -c 2 -W 2 {{ hostvars[groups['database'][0]]['private_ip'] }}
      register: mysql_ping
      ignore_errors: yes

    - name: "→ MySQL Ping 결과"
      debug:
        msg: "{{ '✅ 연결 성공' if mysql_ping.rc == 0 else '❌ 연결 실패' }}"

    - name: Redis 서버 Ping 테스트
      shell: ping -c 2 -W 2 {{ hostvars[groups['cache'][0]]['private_ip'] }}
      register: redis_ping
      ignore_errors: yes

    - name: "→ Redis Ping 결과"
      debug:
        msg: "{{ '✅ 연결 성공' if redis_ping.rc == 0 else '❌ 연결 실패' }}"

    - name: AI 서비스 Ping 테스트
      shell: ping -c 2 -W 2 {{ hostvars[groups['ai_service'][0]]['private_ip'] }}
      register: ai_ping
      ignore_errors: yes

    - name: "→ AI 서비스 Ping 결과"
      debug:
        msg: "{{ '✅ 연결 성공' if ai_ping.rc == 0 else '❌ 연결 실패' }}"

    - name: 1단계 결과 출력
      debug:
        msg: |

          📍 Ping 테스트 결과:
          {% if mysql_ping.rc == 0 %}
          ✅ MySQL ({{ hostvars[groups['database'][0]]['private_ip'] }}): 연결 성공
          {% else %}
          ❌ MySQL ({{ hostvars[groups['database'][0]]['private_ip'] }}): 연결 실패 - Security Group ICMP 규칙 확인 필요
          {% endif %}
          {% if redis_ping.rc == 0 %}
          ✅ Redis ({{ hostvars[groups['cache'][0]]['private_ip'] }}): 연결 성공
          {% else %}
          ❌ Redis ({{ hostvars[groups['cache'][0]]['private_ip'] }}): 연결 실패 - Security Group ICMP 규칙 확인 필요
          {% endif %}
          {% if ai_ping.rc == 0 %}
          ✅ AI Service ({{ hostvars[groups['ai_service'][0]]['private_ip'] }}): 연결 성공
          {% else %}
          ❌ AI Service ({{ hostvars[groups['ai_service'][0]]['private_ip'] }}): 연결 실패 - Security Group ICMP 규칙 확인 필요
          {% endif %}

# ===== 2단계: TCP 포트 연결 테스트 =====
- name: "[2단계] TCP 포트 연결 테스트"
  hosts: main_service
  gather_facts: no
  vars_files:
    - ../group_vars/all/main.yml
  tasks:
    - name: 2단계 시작 메시지
      debug:
        msg: |

          ==========================================
          2단계: TCP 포트 연결 테스트
          ==========================================

    - name: MySQL 포트 3306 연결 테스트 (bash)
      shell: timeout 3 bash -c "</dev/tcp/{{ hostvars[groups['database'][0]]['private_ip'] }}/3306" 2>&1
      register: mysql_port_bash
      ignore_errors: yes

    - name: "→ MySQL 포트 결과"
      debug:
        msg: "{{ '✅ 포트 열림' if mysql_port_bash.rc == 0 else '❌ 포트 닫힘: ' + (mysql_port_bash.stderr | default('연결 실패')) }}"

    - name: Redis 포트 6379 연결 테스트 (bash)
      shell: timeout 3 bash -c "</dev/tcp/{{ hostvars[groups['cache'][0]]['private_ip'] }}/6379" 2>&1
      register: redis_port_bash
      ignore_errors: yes

    - name: "→ Redis 포트 결과"
      debug:
        msg: "{{ '✅ 포트 열림' if redis_port_bash.rc == 0 else '❌ 포트 닫힘: ' + (redis_port_bash.stderr | default('연결 실패')) }}"

    - name: AI 서비스 포트 연결 테스트 (bash)
      shell: timeout 3 bash -c "</dev/tcp/{{ hostvars[groups['ai_service'][0]]['private_ip'] }}/{{ ai_service_port }}" 2>&1
      register: ai_port_bash
      ignore_errors: yes

    - name: "→ AI 서비스 포트 결과"
      debug:
        msg: "{{ '✅ 포트 열림' if ai_port_bash.rc == 0 else '❌ 포트 닫힘: ' + (ai_port_bash.stderr | default('연결 실패')) }}"

    - name: Main 서비스 포트 연결 테스트 (bash)
      shell: timeout 3 bash -c "</dev/tcp/127.0.0.1/{{ main_service_port }}" 2>&1
      register: main_port_bash
      ignore_errors: yes

    - name: "→ Main 서비스 포트 결과"
      debug:
        msg: "{{ '✅ 포트 열림' if main_port_bash.rc == 0 else '❌ 포트 닫힘: ' + (main_port_bash.stderr | default('연결 실패')) }}"

    - name: 2단계 결과 출력
      debug:
        msg: |

          🔌 포트 연결 테스트 결과:
          {% if mysql_port_bash.rc == 0 %}
          ✅ MySQL:3306 - 포트 열림
          {% else %}
          ❌ MySQL:3306 - 포트 닫힘 또는 연결 거부
             원인: {{ mysql_port_bash.stderr | default('연결 실패') }}
             → MySQL 서버가 0.0.0.0:3306에서 리스닝하지 않거나 Security Group 차단
          {% endif %}
          {% if redis_port_bash.rc == 0 %}
          ✅ Redis:6379 - 포트 열림
          {% else %}
          ❌ Redis:6379 - 포트 닫힘 또는 연결 거부
             원인: {{ redis_port_bash.stderr | default('연결 실패') }}
             → Redis 서버가 0.0.0.0:6379에서 리스닝하지 않거나 Security Group 차단
          {% endif %}
          {% if ai_port_bash.rc == 0 %}
          ✅ AI Service:{{ ai_service_port }} - 포트 열림
          {% else %}
          ❌ AI Service:{{ ai_service_port }} - 포트 닫힘 또는 연결 거부
          {% endif %}
          {% if main_port_bash.rc == 0 %}
          ✅ Main Service:{{ main_service_port }} - 포트 열림
          {% else %}
          ❌ Main Service:{{ main_service_port }} - 포트 닫힘 또는 연결 거부
          {% endif %}

# ===== 3단계: MySQL 서버 설정 확인 =====
- name: "[3단계] MySQL 서버 설정 확인"
  hosts: database
  gather_facts: no
  vars_files:
    - ../group_vars/all/main.yml
  tasks:
    - name: 3단계 시작 메시지
      debug:
        msg: |

          ==========================================
          3단계: MySQL 서버 설정 확인
          ==========================================

    - name: 현재 인스턴스의 Security Group ID 확인
      shell: |
        TOKEN=$(curl -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 21600" 2>/dev/null)
        INSTANCE_ID=$(curl -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/instance-id 2>/dev/null)
        aws ec2 describe-instances --instance-ids $INSTANCE_ID --region {{ aws_region }} --query 'Reservations[0].Instances[0].SecurityGroups[*].GroupId' --output text
      register: mysql_sg_ids
      ignore_errors: yes
      environment:
        AWS_REGION: "{{ aws_region }}"

    - name: "→ MySQL Security Group ID"
      debug:
        msg: "{{ mysql_sg_ids.stdout if mysql_sg_ids.rc == 0 else '❌ 확인 불가' }}"

    - name: Security Group 인바운드 규칙 확인 (3306 포트)
      shell: |
        aws ec2 describe-security-groups --group-ids {{ mysql_sg_ids.stdout }} --region {{ aws_region }} --query 'SecurityGroups[*].IpPermissions[?ToPort==`3306`]' --output json
      register: mysql_sg_rules
      ignore_errors: yes
      when: mysql_sg_ids.rc == 0
      environment:
        AWS_REGION: "{{ aws_region }}"

    - name: "→ 3306 포트 인바운드 규칙"
      debug:
        msg: |
          {% if mysql_sg_rules.rc == 0 %}
          {{ mysql_sg_rules.stdout }}

          ✅ Main Service IP: {{ hostvars[groups['main_service'][0]]['private_ip'] }} 허용 확인
          ✅ AI Service IP: {{ hostvars[groups['ai_service'][0]]['private_ip'] }} 허용 확인

          ⚠️  Security Group에서 VPC CIDR (10.0.0.0/16) 또는 위 IP들이 허용되어 있어야 합니다.
          {% else %}
          ❌ 규칙 확인 불가 (AWS CLI 권한 필요)
          {% endif %}
      when: mysql_sg_ids.rc == 0

    - name: MySQL 서비스 상태 확인
      shell: systemctl is-active mysql
      register: mysql_status
      ignore_errors: yes

    - name: MySQL 리스닝 주소 확인
      shell: ss -tlnp | grep 3306 | awk '{print $4}'
      register: mysql_listen
      ignore_errors: yes

    - name: "→ 리스닝 주소 결과"
      debug:
        msg: "{{ mysql_listen.stdout_lines if mysql_listen.rc == 0 else '❌ 포트 3306 리스닝하지 않음' }}"

    - name: MySQL bind-address 설정 확인
      shell: grep -h "^bind-address" /etc/mysql/mysql.conf.d/*.cnf 2>/dev/null || echo "not found"
      register: mysql_bind
      ignore_errors: yes

    - name: "→ bind-address 설정 결과"
      debug:
        msg: "{{ mysql_bind.stdout_lines }}"

    - name: MySQL 사용자 권한 확인
      shell: sudo mysql -e "SELECT user, host FROM mysql.user WHERE user='{{ mysql_app_user }}';" 2>/dev/null
      register: mysql_users
      ignore_errors: yes

    - name: "→ 사용자 권한 결과"
      debug:
        msg: "{{ mysql_users.stdout_lines if mysql_users.rc == 0 else '❌ 확인 실패' }}"

    - name: 3단계 결과 출력
      debug:
        msg: |

          🗄️ MySQL 서버 설정 상태:

          서비스 상태: {% if mysql_status.rc == 0 and mysql_status.stdout == 'active' %}✅ 실행 중{% else %}❌ 중단됨 - sudo systemctl start mysql{% endif %}

          리스닝 주소: {{ mysql_listen.stdout_lines | join(', ') if mysql_listen.stdout_lines else '❌ 리스닝하지 않음' }}
          {% if mysql_listen.stdout is search('0.0.0.0:3306') %}
          ✅ 올바름: 모든 인터페이스에서 수신 (0.0.0.0:3306)
          {% elif mysql_listen.stdout is search('127.0.0.1:3306') %}
          ❌ 문제: localhost에서만 수신 (127.0.0.1:3306)
          해결: bind-address = 0.0.0.0으로 변경 필요
          {% endif %}

          bind-address 설정:
          {{ mysql_bind.stdout_lines | join('\n          ') if mysql_bind.stdout_lines else '❌ 설정 파일에서 찾을 수 없음' }}
          {% if mysql_bind.stdout is search('0.0.0.0') %}
          ✅ 올바름: bind-address = 0.0.0.0
          {% elif mysql_bind.stdout is search('127.0.0.1') %}
          ❌ 문제: bind-address = 127.0.0.1 (외부 접근 불가)
          해결: /etc/mysql/mysql.conf.d/mechuragi.cnf에서 수정 필요
          {% endif %}

          사용자 권한:
          {{ mysql_users.stdout if mysql_users.rc == 0 else '❌ 확인 실패 - MySQL 접근 권한 없음' }}
          {% if mysql_users.stdout is search('10.0.%') or mysql_users.stdout is search('%') %}
          ✅ VPC 내부 접근 허용됨
          {% elif mysql_users.stdout is search('localhost') and not mysql_users.stdout is search('10.0.%') %}
          ❌ 문제: localhost에서만 접근 가능
          해결: GRANT ALL PRIVILEGES ON {{ mysql_database }}.* TO '{{ mysql_app_user }}'@'10.0.%' IDENTIFIED BY '{{ mysql_app_password }}';
          {% endif %}

# ===== 4단계: Redis 서버 설정 확인 =====
- name: "[4단계] Redis 서버 설정 확인"
  hosts: cache
  gather_facts: no
  vars_files:
    - ../group_vars/all/main.yml
  tasks:
    - name: 4단계 시작 메시지
      debug:
        msg: |

          ==========================================
          4단계: Redis 서버 설정 확인
          ==========================================

    - name: 현재 인스턴스의 Security Group ID 확인
      shell: |
        TOKEN=$(curl -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 21600" 2>/dev/null)
        INSTANCE_ID=$(curl -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/instance-id 2>/dev/null)
        aws ec2 describe-instances --instance-ids $INSTANCE_ID --region {{ aws_region }} --query 'Reservations[0].Instances[0].SecurityGroups[*].GroupId' --output text
      register: redis_sg_ids
      ignore_errors: yes
      environment:
        AWS_REGION: "{{ aws_region }}"

    - name: "→ Redis Security Group ID"
      debug:
        msg: "{{ redis_sg_ids.stdout if redis_sg_ids.rc == 0 else '❌ 확인 불가' }}"

    - name: Security Group 인바운드 규칙 확인 (6379 포트)
      shell: |
        aws ec2 describe-security-groups --group-ids {{ redis_sg_ids.stdout }} --region {{ aws_region }} --query 'SecurityGroups[*].IpPermissions[?ToPort==`6379`]' --output json
      register: redis_sg_rules
      ignore_errors: yes
      when: redis_sg_ids.rc == 0
      environment:
        AWS_REGION: "{{ aws_region }}"

    - name: "→ 6379 포트 인바운드 규칙"
      debug:
        msg: |
          {% if redis_sg_rules.rc == 0 %}
          {{ redis_sg_rules.stdout }}

          ✅ Main Service IP: {{ hostvars[groups['main_service'][0]]['private_ip'] }} 허용 확인
          ✅ AI Service IP: {{ hostvars[groups['ai_service'][0]]['private_ip'] }} 허용 확인

          ⚠️  Security Group에서 VPC CIDR (10.0.0.0/16) 또는 위 IP들이 허용되어 있어야 합니다.
          {% else %}
          ❌ 규칙 확인 불가 (AWS CLI 권한 필요)
          {% endif %}
      when: redis_sg_ids.rc == 0

    - name: Redis 서비스 상태 확인
      shell: systemctl is-active redis-server
      register: redis_status
      ignore_errors: yes

    - name: Redis 리스닝 주소 확인
      shell: ss -tlnp | grep 6379 | awk '{print $4}'
      register: redis_listen
      ignore_errors: yes

    - name: "→ 리스닝 주소 결과"
      debug:
        msg: "{{ redis_listen.stdout_lines if redis_listen.rc == 0 else '❌ 포트 6379 리스닝하지 않음' }}"

    - name: Redis bind 설정 확인
      shell: grep "^bind" /etc/redis/redis.conf 2>/dev/null || echo "not found"
      register: redis_bind
      ignore_errors: yes

    - name: "→ bind 설정 결과"
      debug:
        msg: "{{ redis_bind.stdout_lines }}"

    - name: Redis protected-mode 설정 확인
      shell: grep "^protected-mode" /etc/redis/redis.conf 2>/dev/null || echo "not found"
      register: redis_protected
      ignore_errors: yes

    - name: "→ protected-mode 설정 결과"
      debug:
        msg: "{{ redis_protected.stdout_lines }}"

    - name: 4단계 결과 출력
      debug:
        msg: |

          ⚡ Redis 서버 설정 상태:

          서비스 상태: {% if redis_status.rc == 0 and redis_status.stdout == 'active' %}✅ 실행 중{% else %}❌ 중단됨 - sudo systemctl start redis-server{% endif %}

          리스닝 주소: {{ redis_listen.stdout_lines | join(', ') if redis_listen.stdout_lines else '❌ 리스닝하지 않음' }}
          {% if redis_listen.stdout is search('0.0.0.0:6379') %}
          ✅ 올바름: 모든 인터페이스에서 수신 (0.0.0.0:6379)
          {% elif redis_listen.stdout is search('127.0.0.1:6379') %}
          ❌ 문제: localhost에서만 수신 (127.0.0.1:6379)
          해결: bind 0.0.0.0으로 변경 필요
          {% endif %}

          bind 설정:
          {{ redis_bind.stdout if redis_bind.stdout else '❌ 설정 파일에서 찾을 수 없음' }}
          {% if redis_bind.stdout is search('0.0.0.0') %}
          ✅ 올바름: bind 0.0.0.0
          {% elif redis_bind.stdout is search('127.0.0.1') %}
          ❌ 문제: bind 127.0.0.1 (외부 접근 불가)
          해결: /etc/redis/redis.conf에서 수정 필요
          {% endif %}

          protected-mode:
          {{ redis_protected.stdout if redis_protected.stdout else '❌ 설정 파일에서 찾을 수 없음' }}

# ===== 5단계: AI 서비스 실행 상태 확인 =====
- name: "[5단계] AI 서비스 실행 상태 확인"
  hosts: ai_service
  gather_facts: no
  vars_files:
    - ../group_vars/all/main.yml
  tasks:
    - name: 5단계 시작 메시지
      debug:
        msg: |

          ==========================================
          5단계: AI 서비스 실행 상태 확인
          ==========================================
          (GitHub Actions로 배포됨)

    - name: 모든 Docker 컨테이너 확인 (디버깅)
      shell: sudo docker ps --format "{% raw %}{{.Names}}\t{{.Status}}{% endraw %}"
      register: all_containers
      ignore_errors: yes

    - name: "→ 실행 중인 모든 컨테이너"
      debug:
        msg: "{{ all_containers.stdout_lines if all_containers.rc == 0 else '❌ 확인 불가' }}"

    - name: AI 서비스 컨테이너 실행 확인
      shell: sudo docker ps | grep -i ai || echo "not found"
      register: ai_container
      ignore_errors: yes

    - name: "→ AI 컨테이너 상태"
      debug:
        msg: "{{ ai_container.stdout if 'not found' not in ai_container.stdout else '❌ 컨테이너 없음' }}"

    - name: AI 서비스 포트 리스닝 확인
      shell: ss -tlnp | grep {{ ai_service_port }}
      register: ai_port_listen
      ignore_errors: yes

    - name: "→ AI 포트 리스닝"
      debug:
        msg: "{{ '✅ 리스닝 중' if ai_port_listen.rc == 0 else '❌ 리스닝하지 않음' }}"

    - name: 5단계 결과 출력
      debug:
        msg: |

          🤖 AI 서비스 실행 상태:

          컨테이너:
          {% if ai_container.rc == 0 and ai_container.stdout and 'not found' not in ai_container.stdout %}
          ✅ {{ ai_container.stdout }}
          {% else %}
          ❌ 컨테이너 없음 (GitHub Actions 배포 필요)
          {% endif %}

          포트 리스닝 ({{ ai_service_port }}):
          {% if ai_port_listen.rc == 0 %}
          ✅ 리스닝 중
          {% else %}
          ❌ 리스닝하지 않음
          {% endif %}

# ===== 6단계: Main 서비스 실행 상태 확인 =====
- name: "[6단계] Main 서비스 실행 상태 확인"
  hosts: main_service
  gather_facts: no
  vars_files:
    - ../group_vars/all/main.yml
  tasks:
    - name: 6단계 시작 메시지
      debug:
        msg: |

          ==========================================
          6단계: Main 서비스 실행 상태 확인
          ==========================================
          (GitHub Actions로 배포됨)

    - name: Nginx 서비스 상태 확인
      shell: systemctl is-active nginx
      register: nginx_status
      ignore_errors: yes

    - name: "→ Nginx 상태"
      debug:
        msg: "{{ '✅ 실행 중' if nginx_status.rc == 0 and nginx_status.stdout == 'active' else '❌ 중단됨' }}"

    - name: 모든 Docker 컨테이너 확인 (디버깅)
      shell: sudo docker ps --format "{% raw %}{{.Names}}\t{{.Status}}{% endraw %}"
      register: all_containers
      ignore_errors: yes

    - name: "→ 실행 중인 모든 컨테이너"
      debug:
        msg: "{{ all_containers.stdout_lines if all_containers.rc == 0 else '❌ 확인 불가' }}"

    - name: Main 서비스 컨테이너 실행 확인
      shell: sudo docker ps | grep -i main || echo "not found"
      register: main_container
      ignore_errors: yes

    - name: "→ Main 컨테이너 상태"
      debug:
        msg: "{{ main_container.stdout if 'not found' not in main_container.stdout else '❌ 컨테이너 없음' }}"

    - name: Main 서비스 포트 리스닝 확인
      shell: ss -tlnp | grep {{ main_service_port }}
      register: main_port_listen
      ignore_errors: yes

    - name: "→ Main 포트 리스닝"
      debug:
        msg: "{{ '✅ 리스닝 중' if main_port_listen.rc == 0 else '❌ 리스닝하지 않음' }}"

    - name: Nginx 포트 리스닝 확인
      shell: ss -tlnp | grep :80
      register: nginx_port_listen
      ignore_errors: yes

    - name: "→ Nginx 포트 리스닝"
      debug:
        msg: "{{ '✅ 리스닝 중' if nginx_port_listen.rc == 0 else '❌ 리스닝하지 않음' }}"

    - name: 6단계 결과 출력
      debug:
        msg: |

          🚀 Main 서비스 실행 상태:

          Nginx: {% if nginx_status.rc == 0 and nginx_status.stdout == 'active' %}✅ 실행 중{% else %}❌ 중단됨{% endif %}

          컨테이너:
          {% if main_container.rc == 0 and main_container.stdout and 'not found' not in main_container.stdout %}
          ✅ {{ main_container.stdout }}
          {% else %}
          ❌ 컨테이너 없음 (GitHub Actions 배포 필요)
          {% endif %}

          포트 리스닝:
          - Main Service ({{ main_service_port }}): {{ '✅ 리스닝 중' if main_port_listen.rc == 0 else '❌ 리스닝하지 않음' }}
          - Nginx (80): {{ '✅ 리스닝 중' if nginx_port_listen.rc == 0 else '❌ 리스닝하지 않음' }}

# ===== 7단계: 실제 서비스 연결 테스트 =====
- name: "[7단계] 실제 서비스 연결 테스트"
  hosts: main_service
  gather_facts: no
  vars_files:
    - ../group_vars/all/main.yml
  tasks:
    - name: 7단계 시작 메시지
      debug:
        msg: |

          ==========================================
          7단계: 실제 서비스 연결 테스트
          ==========================================

    - name: MySQL 포트 연결 테스트
      wait_for:
        host: "{{ hostvars[groups['database'][0]]['private_ip'] }}"
        port: 3306
        timeout: 10
      ignore_errors: yes
      register: mysql_port_connect

    - name: "→ MySQL 포트 연결"
      debug:
        msg: "{{ '✅ SUCCESS' if mysql_port_connect is succeeded else '❌ FAILED' }}"

    - name: MySQL 클라이언트 설치 확인
      shell: which mysql
      register: mysql_client_check
      ignore_errors: yes

    - name: MySQL 클라이언트 설치 (없는 경우)
      become: yes
      apt:
        name: mysql-client
        state: present
        update_cache: yes
      when: mysql_client_check.rc != 0
      ignore_errors: yes

    - name: "→ MySQL 클라이언트 설치"
      debug:
        msg: "{{ '✅ 이미 설치됨' if mysql_client_check.rc == 0 else '✅ 설치 완료' }}"

    - name: MySQL 애플리케이션 연결 테스트
      shell: |
        mysql -h {{ hostvars[groups['database'][0]]['private_ip'] }} \
              -P 3306 \
              -u {{ mysql_app_user }} \
              -p{{ mysql_app_password }} \
              -e "SELECT 1 AS connection_test;" 2>&1
      register: mysql_app_connect
      ignore_errors: yes

    - name: "→ MySQL 애플리케이션 연결"
      debug:
        msg: "{{ '✅ SUCCESS' if mysql_app_connect.rc == 0 else '❌ FAILED: ' + (mysql_app_connect.stdout | default('')) }}"

    - name: Redis 포트 연결 테스트
      wait_for:
        host: "{{ hostvars[groups['cache'][0]]['private_ip'] }}"
        port: "{{ redis_port }}"
        timeout: 10
      ignore_errors: yes
      register: redis_port_connect

    - name: "→ Redis 포트 연결"
      debug:
        msg: "{{ '✅ SUCCESS' if redis_port_connect is succeeded else '❌ FAILED' }}"

    - name: Redis 클라이언트 설치 확인
      shell: which redis-cli
      register: redis_client_check
      ignore_errors: yes

    - name: Redis 클라이언트 설치 (없는 경우)
      become: yes
      apt:
        name: redis-tools
        state: present
        update_cache: yes
      when: redis_client_check.rc != 0
      ignore_errors: yes

    - name: "→ Redis 클라이언트 설치"
      debug:
        msg: "{{ '✅ 이미 설치됨' if redis_client_check.rc == 0 else '✅ 설치 완료' }}"

    - name: Redis 애플리케이션 연결 테스트
      shell: redis-cli -h {{ hostvars[groups['cache'][0]]['private_ip'] }} -p {{ redis_port }} ping 2>&1
      register: redis_app_connect
      ignore_errors: yes

    - name: "→ Redis 애플리케이션 연결"
      debug:
        msg: "{{ '✅ SUCCESS (PONG)' if redis_app_connect.rc == 0 and 'PONG' in redis_app_connect.stdout else '❌ FAILED: ' + (redis_app_connect.stdout | default('')) }}"

    - name: AI 서비스 포트 연결 테스트
      wait_for:
        host: "{{ hostvars[groups['ai_service'][0]]['private_ip'] }}"
        port: "{{ ai_service_port }}"
        timeout: 10
      ignore_errors: yes
      register: ai_port_connect

    - name: "→ AI 서비스 포트 연결"
      debug:
        msg: "{{ '✅ SUCCESS' if ai_port_connect is succeeded else '❌ FAILED' }}"

    - name: AI 서비스 헬스체크
      uri:
        url: "http://{{ hostvars[groups['ai_service'][0]]['private_ip'] }}:{{ ai_service_port }}/actuator/health"
        method: GET
        timeout: 10
      register: ai_health_connect
      ignore_errors: yes

    - name: "→ AI 서비스 헬스체크"
      debug:
        msg: "{{ '✅ SUCCESS (HTTP ' + ai_health_connect.status|string + ')' if ai_health_connect.status is defined and ai_health_connect.status == 200 else '❌ FAILED' }}"

    - name: 메인 서비스 자체 헬스체크
      uri:
        url: "http://127.0.0.1:{{ main_service_port }}/actuator/health"
        method: GET
        timeout: 10
      register: main_health_check
      ignore_errors: yes

    - name: "→ 메인 서비스 헬스체크"
      debug:
        msg: "{{ '✅ SUCCESS (HTTP ' + main_health_check.status|string + ')' if main_health_check.status is defined and main_health_check.status == 200 else '❌ FAILED' }}"

    - name: 7단계 결과 출력
      debug:
        msg: |

          🧪 실제 서비스 연결 테스트 결과:

          1. MySQL ({{ hostvars[groups['database'][0]]['private_ip'] }}:3306)
             - 포트 연결: {{ '✅ SUCCESS' if mysql_port_connect is succeeded else '❌ FAILED - 타임아웃 또는 포트 닫힘' }}
             - 애플리케이션 연결: {{ '✅ SUCCESS' if mysql_app_connect.rc == 0 else '❌ FAILED' }}
             {% if mysql_app_connect.rc != 0 %}
             에러: {{ mysql_app_connect.stdout | default(mysql_app_connect.stderr) }}

             일반적인 에러:
             - ERROR 2003 (HY000) Can't connect (111): MySQL이 0.0.0.0:3306에서 리스닝하지 않음
             - ERROR 2003 (HY000) Can't connect (110): Connection timed out - Security Group 차단
             - ERROR 1045 (28000) Access denied: 사용자 권한 문제 - host 설정 확인 필요
             {% endif %}

          2. Redis ({{ hostvars[groups['cache'][0]]['private_ip'] }}:{{ redis_port }})
             - 포트 연결: {{ '✅ SUCCESS' if redis_port_connect is succeeded else '❌ FAILED - 타임아웃 또는 포트 닫힘' }}
             - 애플리케이션 연결: {{ '✅ SUCCESS (PONG)' if redis_app_connect.rc == 0 and 'PONG' in redis_app_connect.stdout else '❌ FAILED' }}
             {% if redis_app_connect.rc != 0 or 'PONG' not in redis_app_connect.stdout %}
             에러: {{ redis_app_connect.stdout | default(redis_app_connect.stderr) }}

             해결 방법:
             - Redis 서버가 0.0.0.0:6379에서 리스닝하는지 확인
             - Security Group에서 6379 포트 허용 확인
             {% endif %}

          3. AI Service ({{ hostvars[groups['ai_service'][0]]['private_ip'] }}:{{ ai_service_port }})
             - 포트 연결: {{ '✅ SUCCESS' if ai_port_connect is succeeded else '❌ FAILED - 타임아웃 또는 포트 닫힘' }}
             - 헬스체크: {{ '✅ SUCCESS (HTTP ' + ai_health_connect.status|string + ')' if ai_health_connect.status is defined and ai_health_connect.status == 200 else '❌ FAILED - 서비스 미실행 또는 연결 불가' }}

          4. Main Service (자체 헬스체크)
             - 헬스체크: {{ '✅ SUCCESS (HTTP ' + main_health_check.status|string + ')' if main_health_check.status is defined and main_health_check.status == 200 else '❌ FAILED - 서비스 미실행' }}

# ===== 8단계: 최종 요약 및 종합 결과 =====
- name: "[8단계] 최종 요약 및 종합 결과"
  hosts: main_service
  gather_facts: no
  vars_files:
    - ../group_vars/all/main.yml
  tasks:
    - name: 최종 연결성 상태 종합
      set_fact:
        all_services_healthy: "{{
          (mysql_port_connect is succeeded and mysql_app_connect.rc == 0) and
          (redis_port_connect is succeeded and redis_app_connect.rc == 0 and 'PONG' in redis_app_connect.stdout) and
          (ai_port_connect is succeeded and ai_health_connect.status is defined and ai_health_connect.status == 200) and
          (main_health_check.status is defined and main_health_check.status == 200)
        }}"
      ignore_errors: yes

    - name: 최종 요약 메시지
      debug:
        msg: |

          ==========================================
          ✅ VPC 내부 연결성 진단 테스트 완료
          ==========================================

          📍 테스트 서버: {{ inventory_hostname }} ({{ ansible_host }})

          📋 테스트 단계별 체크리스트:
          - [1단계] ✅ 기본 네트워크 연결 (ICMP Ping)
          - [2단계] ✅ TCP 포트 연결 테스트
          - [3단계] ✅ MySQL 서버 상세 설정 확인 (Ansible)
          - [4단계] ✅ Redis 서버 상세 설정 확인 (Ansible)
          - [5단계] ✅ AI 서비스 실행 상태 확인 (GitHub Actions)
          - [6단계] ✅ Main 서비스 실행 상태 확인 (GitHub Actions)
          - [7단계] ✅ 실제 서비스 연결 테스트 (포트 + 애플리케이션)
          - [8단계] ✅ 최종 요약 및 해결 방안

          🌐 서비스 간 연결성 최종 상태:

          1. MySQL ({{ hostvars[groups['database'][0]]['private_ip'] }}:3306)
             {{ '✅ 정상' if mysql_port_connect is succeeded and mysql_app_connect.rc == 0 else '❌ 실패' }}

          2. Redis ({{ hostvars[groups['cache'][0]]['private_ip'] }}:{{ redis_port }})
             {{ '✅ 정상' if redis_port_connect is succeeded and redis_app_connect.rc == 0 and 'PONG' in redis_app_connect.stdout else '❌ 실패' }}

          3. AI Service ({{ hostvars[groups['ai_service'][0]]['private_ip'] }}:{{ ai_service_port }})
             {{ '✅ 정상' if ai_port_connect is succeeded and ai_health_connect.status is defined and ai_health_connect.status == 200 else '❌ 실패' }}

          4. Main Service (자체)
             {{ '✅ 정상' if main_health_check.status is defined and main_health_check.status == 200 else '❌ 실패' }}

          {% if all_services_healthy %}
          ==========================================
          🎉 모든 서비스 연결 정상!
          ==========================================
          VPC 내부 통신이 정상적으로 작동하고 있습니다.
          메추라기 분산 서비스 아키텍처가 준비되었습니다.
          {% else %}
          ==========================================
          ⚠️  일부 서비스 연결 실패
          ==========================================
          {% endif %}

          🔍 문제 해결 방법:

          1. MySQL 연결 실패 시:
             - MySQL 서비스 상태: sudo systemctl status mysql
             - bind-address = 0.0.0.0 확인: grep bind-address /etc/mysql/mysql.conf.d/*.cnf
             - 사용자 권한 10.0.% 확인: sudo mysql -e "SELECT user, host FROM mysql.user;"
             - Security Group 3306 포트 허용 확인 (AWS 콘솔)
             - 재배포: ansible-playbook -i inventory/hosts.yml playbooks/setup-database.yml

          2. Redis 연결 실패 시:
             - Redis 서비스 상태: sudo systemctl status redis-server
             - bind 0.0.0.0 확인: grep "^bind" /etc/redis/redis.conf
             - Security Group 6379 포트 허용 확인 (AWS 콘솔)
             - 재배포: ansible-playbook -i inventory/hosts.yml playbooks/setup-cache.yml

          3. AI Service 연결 실패 시:
             - 컨테이너 상태 확인: ssh -i ~/.ssh/mechuragi-dev-key.pem ubuntu@<ai-ip>
               sudo docker ps -a | grep ai-service
             - 컨테이너 로그: sudo docker logs ai-service
             - Security Group {{ ai_service_port }} 포트 확인
             - 재배포: GitHub에 AI Service 레포 푸시 (GitHub Actions 자동 배포)

          4. Main Service 실패 시:
             - 컨테이너 상태 확인: ssh -i ~/.ssh/mechuragi-dev-key.pem ubuntu@<main-ip>
               sudo docker ps -a | grep main-service
             - Nginx 상태: sudo systemctl status nginx
             - 재배포: GitHub에 Main Service 레포 푸시 (GitHub Actions 자동 배포)

          📚 추가 참고 자료:
          - VPC 내부 통신 문서: docs/vpc-internal-connectivity.md
          - 인프라 재배포 (MySQL, Redis):
            ansible-playbook -i inventory/hosts.yml playbooks/deploy-all-services.yml
