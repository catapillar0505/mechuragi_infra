---
- name: Deploy Mechuragi Services to Distributed Infrastructure
  hosts: localhost
  gather_facts: no
  vars_prompt:
    - name: "main_service_public_ip"
      prompt: "Main Service Public IP"
      private: no
    - name: "ai_service_private_ip"
      prompt: "AI Service Private IP"
      private: no
    - name: "mysql_private_ip"
      prompt: "MySQL Private IP"
      private: no
    - name: "redis_private_ip"
      prompt: "Redis Private IP"
      private: no

  tasks:
    - name: Update inventory with dynamic IPs
      set_fact:
        main_service_public_ip: "{{ main_service_public_ip }}"
        ai_service_private_ip: "{{ ai_service_private_ip }}"
        mysql_private_ip: "{{ mysql_private_ip }}"
        redis_private_ip: "{{ redis_private_ip }}"

    - name: Display deployment plan
      debug:
        msg: |
          Mechuragi Distributed Deployment Plan:
          =====================================
          Main Service (SpringBoot + Docker): {{ main_service_public_ip }}
          AI Service (SpringBoot + Docker): {{ ai_service_private_ip }}
          MySQL Database (Native): {{ mysql_private_ip }}
          Redis Cache (Native): {{ redis_private_ip }}

# Phase 1: Setup Database Layer
- import_playbook: setup-mysql-native.yml

# Phase 2: Setup Cache Layer
- import_playbook: setup-redis-native.yml

# Phase 3: Setup AI Recommendation Service
- import_playbook: setup-ai-service.yml

# Phase 4: Setup Main Service (depends on all above)
- import_playbook: setup-main-service.yml

# Phase 5: Verification
- name: Verify Services
  hosts: all
  gather_facts: no
  tasks:
    - name: Wait for services to be ready
      pause:
        seconds: 30

    - name: Verify MySQL is running
      wait_for:
        host: "{{ mysql_private_ip }}"
        port: 3306
        timeout: 60
      when: inventory_hostname in groups['database']

    - name: Verify Redis is running
      wait_for:
        host: "{{ redis_private_ip }}"
        port: "{{ redis_port }}"
        timeout: 60
      when: inventory_hostname in groups['cache']

    - name: Verify AI Service is running
      uri:
        url: "http://{{ ai_service_private_ip }}:{{ ai_service_port }}/actuator/health"
        method: GET
        timeout: 30
      when: inventory_hostname in groups['ai_service']
      ignore_errors: yes

    - name: Verify Main Service is running
      uri:
        url: "http://{{ main_service_public_ip }}:{{ main_service_port }}/actuator/health"
        method: GET
        timeout: 30
      when: inventory_hostname in groups['main_service']
      ignore_errors: yes

    - name: Display service status
      debug:
        msg: "{{ inventory_hostname }} - {{ server_type }} service verification completed"