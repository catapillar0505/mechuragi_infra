---
- name: 메추라기 서버 설정 검증
  hosts: mechuragi-server
  become: yes
  gather_facts: yes
  vars_files:
    - ../group_vars/all.yml
  vars:
    app_directory: "/home/ubuntu/app"

  tasks:
    # 기본 시스템 정보 확인
    - name: 1. 시스템 기본 정보 확인
      debug:
        msg:
          - "프로젝트: {{ project_name }}"
          - "환경: {{ env }}"
          - "호스트명: {{ ansible_hostname }}"
          - "OS: {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "아키텍처: {{ ansible_architecture }}"

    # Python 및 pip 설치 확인
    - name: 2. Python 및 pip 설치 확인
      command: "{{ item }}"
      register: python_check
      ignore_errors: yes
      loop:
        - "python3 --version"
        - "pip3 --version"

    - name: 3. Python 설치 상태 출력
      debug:
        msg: "{{ item.cmd }}: {{ item.stdout if item.rc == 0 else '설치되지 않음' }}"
      loop: "{{ python_check.results }}"

    # AWS SDK 설치 확인
    - name: 4. AWS SDK 설치 확인
      command: pip3 list | grep -E "(boto3|botocore)"
      register: aws_sdk_check
      ignore_errors: yes

    - name: 5. AWS SDK 설치 상태 출력
      debug:
        msg: "AWS SDK 상태: {{ aws_sdk_check.stdout_lines if aws_sdk_check.rc == 0 else 'AWS SDK가 설치되지 않음' }}"

    # 설정 파일 확인
    - name: 6. AWS 서비스 설정 파일 존재 확인
      stat:
        path: "{{ item }}"
      register: config_files
      loop:
        - "{{ config_directory }}/bedrock_config.env"
        - "{{ config_directory }}/ses_config.env"
        - "{{ config_directory }}/cloudfront_config.env"

    - name: 7. 설정 파일 상태 출력
      debug:
        msg: "{{ item.item }}: {{ '존재함' if item.stat.exists else '존재하지 않음' }}"
      loop: "{{ config_files.results }}"
    # 포트 및 네트워크 확인
    - name: 8. 포트 리스닝 상태 확인
      command: netstat -tuln | grep -E "(3306|{{ redis_port }})"
      register: port_check
      ignore_errors: yes

    - name: 9. 포트 리스닝 결과 출력
      debug:
        msg: "활성 포트: {{ port_check.stdout_lines if port_check.rc == 0 else '데이터베이스 포트가 열려있지 않음' }}"

    # 데이터베이스 확인
    - name: 10. MySQL 컨테이너 상태 확인
      command: docker ps --filter "name=mysql" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
      register: mysql_container
      ignore_errors: yes

    - name: 11. MySQL 버전 정보 확인
      command: docker exec mysql-server mysql --version
      register: mysql_version
      ignore_errors: yes
      when: mysql_container.rc == 0

    - name: 12. MySQL 상태 출력
      debug:
        msg:
          - "MySQL 컨테이너: {{ mysql_container.stdout if mysql_container.rc == 0 else 'MySQL 컨테이너가 실행되지 않음' }}"
          - "MySQL 버전: {{ mysql_version.stdout if mysql_version is defined and mysql_version.rc == 0 else '버전 확인 실패' }}"

    # 서비스 상태 확인
    - name: 13. 주요 서비스 상태 확인
      systemd:
        name: "{{ item }}"
      register: service_status
      ignore_errors: yes
      loop:
        - docker
        - redis-server

    - name: 14. 서비스 상태 결과 출력
      debug:
        msg: "{{ item.item }}: {{ 'active' if item.status is defined and item.status.ActiveState == 'active' else 'inactive/failed' }}"
      loop: "{{ service_status.results }}"

    # Docker 컨테이너 확인
    - name: 15. 실행 중인 Docker 컨테이너 목록 확인
      command: docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}"
      register: docker_containers
      ignore_errors: yes

    - name: 16. Docker 컨테이너 목록 출력
      debug:
        msg: "{{ docker_containers.stdout_lines if docker_containers.rc == 0 else ['Docker 서비스가 실행되지 않거나 컨테이너가 없음'] }}"

    # 시스템 리소스 확인
    - name: 17. 디스크 사용량 확인
      command: df -h /
      register: disk_usage
      ignore_errors: yes

    - name: 18. 디스크 사용량 출력
      debug:
        msg: "루트 파티션 사용량: {{ disk_usage.stdout_lines[1] if disk_usage.rc == 0 and disk_usage.stdout_lines|length > 1 else '디스크 정보 확인 실패' }}"

    - name: 19. 메모리 사용량 확인
      command: free -h
      register: memory_usage
      ignore_errors: yes

    - name: 20. 메모리 사용량 출력
      debug:
        msg: "{{ memory_usage.stdout_lines if memory_usage.rc == 0 else ['메모리 정보 확인 실패'] }}"

    - name: 21. CPU 및 시스템 부하 확인
      command: "{{ item }}"
      register: system_info
      ignore_errors: yes
      loop:
        - "nproc"
        - "uptime"

    - name: 22. 시스템 리소스 정보 출력
      debug:
        msg:
          - "CPU 코어 수: {{ system_info.results[0].stdout if system_info.results[0].rc == 0 else '확인 실패' }}"
          - "시스템 부하: {{ system_info.results[1].stdout if system_info.results[1].rc == 0 else '확인 실패' }}"

    # 애플리케이션 디렉토리 확인
    - name: 23. 애플리케이션 디렉토리 상태 확인
      stat:
        path: "{{ app_directory }}"
      register: app_dir_status

    - name: 24. 설정 디렉토리 상태 확인
      stat:
        path: "{{ config_directory }}"
      register: config_dir_status

    - name: 25. 디렉토리 상태 출력
      debug:
        msg:
          - "애플리케이션 디렉토리 ({{ app_directory }}): {{ '존재함' if app_dir_status.stat.exists else '존재하지 않음' }}"
          - "설정 디렉토리 ({{ config_directory }}): {{ '존재함' if config_dir_status.stat.exists else '존재하지 않음' }}"

    # 최종 검증 결과
    - name: 26. 전체 설정 검증 완료 메시지
      debug:
        msg:
          - "🔍 {{ project_name }} 서버 설정 검증 완료!"
          - "환경: {{ env }}"
          - "모든 시스템 상태가 확인되었습니다."
          - "서버 운영 준비 상태를 점검하세요."