---
- name: AWS Bedrock AI 서비스 연동 설정
  hosts: localhost
  connection: local
  gather_facts: no

  tasks:
    - name: 1. AWS Bedrock 서비스 가용성 확인
      amazon.aws.aws_config_service_link_role:
        state: present
      ignore_errors: yes
      register: bedrock_availability

    - name: 2. Bedrock 모델 액세스 권한 확인
      uri:
        url: "https://bedrock.{{ aws_region }}.amazonaws.com/foundation-models"
        method: GET
        headers:
          Authorization: "AWS4-HMAC-SHA256 Credential={{ ansible_aws_access_key }}/{{ ansible_date_time.date }}/{{ aws_region }}/bedrock/aws4_request"
      register: bedrock_models
      ignore_errors: yes

    - name: 3. IAM 역할 생성 - Bedrock 접근용
      amazon.aws.iam_role:
        name: "{{ project_name }}-{{ environment }}-bedrock-role"
        assume_role_policy_document: |
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Principal": {
                  "Service": [
                    "ec2.amazonaws.com",
                    "lambda.amazonaws.com"
                  ]
                },
                "Action": "sts:AssumeRole"
              }
            ]
          }
        managed_policies:
          - "arn:aws:iam::aws:policy/AmazonBedrockReadOnlyAccess"
        inline_policies:
          BedrockInvokePolicy: |
            {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Action": [
                    "bedrock:InvokeModel",
                    "bedrock:InvokeModelWithResponseStream",
                    "bedrock:ListFoundationModels",
                    "bedrock:GetFoundationModel"
                  ],
                  "Resource": [
                    "arn:aws:bedrock:{{ aws_region }}::foundation-model/anthropic.claude-3-sonnet-20240229-v1:0",
                    "arn:aws:bedrock:{{ aws_region }}::foundation-model/anthropic.claude-3-haiku-20240307-v1:0",
                    "arn:aws:bedrock:{{ aws_region }}::foundation-model/amazon.titan-embed-text-v1"
                  ]
                }
              ]
            }
        tags:
          Name: "{{ project_name }}-{{ environment }}-bedrock-role"
          Project: "{{ project_name }}"
          Environment: "{{ environment }}"
        state: present

    - name: 4. EC2 인스턴스 프로파일 생성
      amazon.aws.iam_instance_profile:
        name: "{{ project_name }}-{{ environment }}-bedrock-profile"
        roles:
          - "{{ project_name }}-{{ environment }}-bedrock-role"
        state: present

    - name: 5. AWS CLI 및 SDK 설정 확인 (서버에서)
      delegate_to: mechuragi-server
      command: aws bedrock list-foundation-models --region {{ aws_region }}
      register: bedrock_models_list
      ignore_errors: yes
      become: yes

    - name: 6. Python Boto3 라이브러리 설치 (서버에서)
      delegate_to: mechuragi-server
      pip:
        name:
          - boto3
          - botocore
        state: present
      become: yes

    - name: 7. Bedrock 테스트 스크립트 생성
      delegate_to: mechuragi-server
      copy:
        content: |
          #!/usr/bin/env python3
          import boto3
          import json
          import sys
          from datetime import datetime
          
          def test_bedrock_connection():
              try:
                  # Bedrock 클라이언트 생성
                  bedrock = boto3.client('bedrock', region_name='{{ aws_region }}')
                  bedrock_runtime = boto3.client('bedrock-runtime', region_name='{{ aws_region }}')
                  
                  print("🔍 Bedrock 연결 테스트 시작...")
                  
                  # 1. 사용 가능한 모델 목록 확인
                  print("\n📋 사용 가능한 Foundation Models:")
                  models = bedrock.list_foundation_models()
                  
                  for model in models['modelSummaries'][:5]:  # 처음 5개만 표시
                      print(f"  - {model['modelName']}: {model['modelId']}")
                  
                  # 2. Claude 3 Haiku 모델 테스트 (빠르고 저렴)
                  model_id = "anthropic.claude-3-haiku-20240307-v1:0"
                  
                  test_prompt = {
                      "anthropic_version": "bedrock-2023-05-31",
                      "max_tokens": 100,
                      "messages": [
                          {
                              "role": "user",
                              "content": "{{ project_name }} 프로젝트를 위한 간단한 AI 추천 시스템에 대해 한 문장으로 설명해주세요."
                          }
                      ]
                  }
                  
                  print(f"\n🤖 Claude 3 Haiku 모델 테스트...")
                  response = bedrock_runtime.invoke_model(
                      modelId=model_id,
                      body=json.dumps(test_prompt),
                      contentType='application/json'
                  )
                  
                  response_body = json.loads(response['body'].read())
                  ai_response = response_body['content'][0]['text']
                  
                  print(f"✅ AI 응답: {ai_response}")
                  
                  # 3. Embedding 모델 테스트
                  embed_model_id = "amazon.titan-embed-text-v1"
                  
                  embed_prompt = {
                      "inputText": "메추라기 사용자 추천 시스템"
                  }
                  
                  print(f"\n📊 Titan Embedding 모델 테스트...")
                  embed_response = bedrock_runtime.invoke_model(
                      modelId=embed_model_id,
                      body=json.dumps(embed_prompt),
                      contentType='application/json'
                  )
                  
                  embed_body = json.loads(embed_response['body'].read())
                  embedding_vector = embed_body['embedding']
                  
                  print(f"✅ 임베딩 벡터 차원: {len(embedding_vector)}")
                  print(f"   벡터 샘플: {embedding_vector[:5]}")
                  
                  print(f"\n🎉 Bedrock 연동 테스트 성공!")
                  print(f"   테스트 시간: {datetime.now().strftime('%Y-%m-%d %H:%M:%S')}")
                  
                  return True
                  
              except Exception as e:
                  print(f"❌ Bedrock 연동 실패: {str(e)}")
                  return False
          
          if __name__ == "__main__":
              success = test_bedrock_connection()
              sys.exit(0 if success else 1)
        dest: /home/ec2-user/app/test_bedrock.py
        mode: '0755'
        owner: ec2-user
        group: ec2-user
      become: yes

    - name: 8. Bedrock 설정 파일 생성 (애플리케이션용)
      delegate_to: mechuragi-server
      copy:
        content: |
          # AWS Bedrock Configuration for {{ project_name }}
          # 이 파일을 애플리케이션의 설정에 포함하세요
          
          AWS_REGION={{ aws_region }}
          
          # Bedrock Model IDs
          BEDROCK_CHAT_MODEL=anthropic.claude-3-haiku-20240307-v1:0
          BEDROCK_SMART_MODEL=anthropic.claude-3-sonnet-20240229-v1:0
          BEDROCK_EMBEDDING_MODEL=amazon.titan-embed-text-v1
          
          # Bedrock Endpoints
          BEDROCK_ENDPOINT=https://bedrock.{{ aws_region }}.amazonaws.com
          BEDROCK_RUNTIME_ENDPOINT=https://bedrock-runtime.{{ aws_region }}.amazonaws.com
          
          # Model Parameters
          MAX_TOKENS=1000
          TEMPERATURE=0.7
          TOP_P=0.9
          
          # Rate Limiting
          REQUESTS_PER_MINUTE=60
          CONCURRENT_REQUESTS=5
        dest: /home/ec2-user/app/bedrock_config.env
        owner: ec2-user
        group: ec2-user
        mode: '0644'
      become: yes

    - name: 9. Bedrock 연동 테스트 실행
      delegate_to: mechuragi-server
      command: python3 /home/ec2-user/app/test_bedrock.py
      register: bedrock_test_result
      become_user: ec2-user
      ignore_errors: yes

    - name: 10. Bedrock 테스트 결과 출력
      debug:
        msg: "{{ bedrock_test_result.stdout_lines }}"
      when: bedrock_test_result.stdout_lines is defined

    - name: 11. 애플리케이션용 AI 추천 예제 코드 생성
      delegate_to: mechuragi-server
      copy:
        content: |
          #!/usr/bin/env python3
          """
          {{ project_name }} AI 추천 시스템 예제 코드
          AWS Bedrock을 사용한 사용자 맞춤형 추천 생성
          """
          
          import boto3
          import json
          import logging
          from typing import List, Dict, Any
          
          class MechuragiAIRecommendation:
              def __init__(self, region_name: str = '{{ aws_region }}'):
                  self.bedrock_runtime = boto3.client('bedrock-runtime', region_name=region_name)
                  self.chat_model = "anthropic.claude-3-haiku-20240307-v1:0"
                  self.embedding_model = "amazon.titan-embed-text-v1"
                  
                  logging.basicConfig(level=logging.INFO)
                  self.logger = logging.getLogger(__name__)
          
              def generate_user_recommendations(self, user_profile: Dict[str, Any], 
                                              preferences: List[str], 
                                              history: List[str]) -> Dict[str, Any]:
                  """사용자 프로필 기반 맞춤형 추천 생성"""
                  
                  prompt = {
                      "anthropic_version": "bedrock-2023-05-31",
                      "max_tokens": 500,
                      "messages": [
                          {
                              "role": "user",
                              "content": f"""
                              {{ project_name }} 서비스의 사용자 추천 시스템입니다.
                              
                              사용자 정보:
                              - 나이: {user_profile.get('age', '미제공')}
                              - 성별: {user_profile.get('gender', '미제공')}
                              - 관심사: {', '.join(preferences)}
                              - 이전 활동: {', '.join(history)}
                              
                              이 사용자에게 맞는 5가지 추천 항목을 JSON 형태로 제공해주세요.
                              각 추천에는 제목, 설명, 이유, 점수(1-10)를 포함해주세요.
                              """
                          }
                      ]
                  }
                  
                  try:
                      response = self.bedrock_runtime.invoke_model(
                          modelId=self.chat_model,
                          body=json.dumps(prompt),
                          contentType='application/json'
                      )
                      
                      response_body = json.loads(response['body'].read())
                      recommendation = response_body['content'][0]['text']
                      
                      self.logger.info("AI 추천 생성 성공")
                      return {
                          "status": "success",
                          "recommendations": recommendation,
                          "model_used": self.chat_model
                      }
                      
                  except Exception as e:
                      self.logger.error(f"추천 생성 실패: {str(e)}")
                      return {
                          "status": "error",
                          "error": str(e)
                      }
          
              def create_content_embedding(self, content: str) -> List[float]:
                  """콘텐츠 임베딩 벡터 생성 (유사도 검색용)"""
                  
                  prompt = {
                      "inputText": content
                  }
                  
                  try:
                      response = self.bedrock_runtime.invoke_model(
                          modelId=self.embedding_model,
                          body=json.dumps(prompt),
                          contentType='application/json'
                      )
                      
                      response_body = json.loads(response['body'].read())
                      embedding = response_body['embedding']
                      
                      self.logger.info(f"임베딩 생성 성공: {len(embedding)} 차원")
                      return embedding
                      
                  except Exception as e:
                      self.logger.error(f"임베딩 생성 실패: {str(e)}")
                      return []
          
          # 사용 예제
          if __name__ == "__main__":
              ai_recommender = MechuragiAIRecommendation()
              
              # 테스트 사용자 데이터
              test_user = {
                  "age": 25,
                  "gender": "여성",
              }
              
              test_preferences = ["요리", "여행", "독서", "영화"]
              test_history = ["이탈리아 요리 레시피 검색", "제주도 여행 계획", "추리소설 추천"]
              
              # AI 추천 생성
              result = ai_recommender.generate_user_recommendations(
                  test_user, test_preferences, test_history
              )
              
              print("🤖 AI 추천 결과:")
              print(json.dumps(result, indent=2, ensure_ascii=False))
              
              # 콘텐츠 임베딩 테스트
              content = "맛있는 한국 전통 요리 레시피"
              embedding = ai_recommender.create_content_embedding(content)
              
              if embedding:
                  print(f"\n📊 임베딩 벡터 생성 완료: {len(embedding)} 차원")
        dest: /home/ec2-user/app/ai_recommendation_example.py
        mode: '0755'
        owner: ec2-user
        group: ec2-user
      become: yes

    - name: 12. Bedrock 설정 완료 메시지
      debug:
        msg:
          - "🤖 AWS Bedrock 연동 설정 완료!"
          - "설정된 모델:"
          - "  - Chat: Claude 3 Haiku (빠른 응답)"
          - "  - Smart: Claude 3 Sonnet (고품질)"
          - "  - Embedding: Titan Embed Text"
          - ""
          - "📋 생성된 파일:"
          - "  - /home/ec2-user/app/test_bedrock.py"
          - "  - /home/ec2-user/app/bedrock_config.env"
          - "  - /home/ec2-user/app/ai_recommendation_example.py"
          - ""
          - "🔧 다음 단계:"
          - "  1. AWS 콘솔에서 Bedrock 모델 액세스 요청"
          - "  2. 테스트 스크립트 실행: python3 test_bedrock.py"
          - "  3. 애플리케이션에 AI 추천 기능 통합"

    - name: 13. 비용 최적화 안내
      debug:
        msg:
          - "💰 Bedrock 비용 최적화 팁:"
          - "  - Haiku 모델: 빠르고 저렴 (일반 응답용)"
          - "  - Sonnet 모델: 고품질 (중요한 응답용)"
          - "  - 캐싱 활용: 반복적인 요청 저장"
          - "  - 요청 수 모니터링: CloudWatch 활용"
          - "  - 배치 처리: 대량 요청 시 효율적"