[defaults]
inventory = inventory/hosts.yml
remote_user = ubuntu
# private_key_file는 group_vars/all.yml에서 관리
host_key_checking = False
timeout = 30
gather_timeout = 30
roles_path = roles

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no
pipelining = True
